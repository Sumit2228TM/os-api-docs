<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenSpecimen API — Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    html {
      box-sizing: border-box;
      overflow-y: scroll;
    }
    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
    }
    #swagger-ui {
      max-width: none;
      margin: 0;
    }
    .swagger-ui .topbar {
      display: none;
    }
    #spec-banner {
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      padding: 0.4rem 1rem;
      background: #f0f4f8;
      border-bottom: 1px solid #d0d7de;
      color: #24292f;
    }
    #spec-banner a {
      color: #0969da;
    }
  </style>
</head>
<body>
  <div id="spec-banner"></div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function () {
      var params = new URLSearchParams(window.location.search);
      var relative = sessionStorage.getItem("osOpenApiSpec");
      if (relative) {
        sessionStorage.removeItem("osOpenApiSpec");
      }
      if (!relative) {
        relative = params.get("yaml");
      }
      if (!relative) {
        relative = "../master/create-specimen.yaml";
      }
      try {
        relative = decodeURIComponent(relative);
      } catch (e) {
        /* keep raw */
      }
      var specUrl = new URL(relative, window.location.href).href;

      var banner = document.getElementById("spec-banner");
      banner.innerHTML =
        "Spec: <code>" + relative.replace(/</g, "&lt;") + "</code> · " +
        '<a href="endpoints.html">Back to index</a>';

      window.ui = SwaggerUIBundle({
        url: specUrl,
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: "list",
        filter: true,
        tryItOutEnabled: true
      });
    };
  </script>
</body>
</html>
