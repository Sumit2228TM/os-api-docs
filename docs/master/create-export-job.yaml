openapi: 3.0.3
info:
  title: "OpenSpecimen API — Create Export Job"
  version: 1.0.0
  description: |
    Create Export Job — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/ExportJobsController.java` (`createExportJob`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/exporter/events/ExportDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: ExportJobs
    description: "Operations from `ExportJobsController.java`"
paths:
  /export-jobs:
    post:
      operationId: createExportJob
      summary: createExportJob
      description: "POST /export-jobs — `ExportJobsController.java`.`createExportJob`"
      tags:
        - ExportJobs
      responses:
        '200':
          description: "Successful response for Create Export Job"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    name: "Baseline Visit 1"
                    status: PENDING
                    totalRecords: 1
                    createdBy:
                      id: 1001
                    creationTime: "2024-10-22T14:30:00Z"
                    endTime: "2024-10-22T14:30:00Z"
                    params:
                      id: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDetail"
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  objectType: specimen
                  params:
                    id: 1001
                  recordIds:
                    - 1
                  synchronous: false
                  disableNotifs: false
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    ExportDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/exporter/events/ExportDetail.java`"
      properties:
        objectType:
          type: string
        params:
          $ref: "#/components/schemas/Map"
        recordIds:
          type: array
          items:
            type: integer
            format: int64
        synchronous:
          type: boolean
        disableNotifs:
          type: boolean
    Map:
      type: object
      description: "Type `Map` (Java source not found in repository)"
    ExportJobDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/exporter/events/ExportJobDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
        totalRecords:
          type: integer
          format: int64
        createdBy:
          $ref: "#/components/schemas/UserSummary"
        creationTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        params:
          $ref: "#/components/schemas/Map"
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        apiUser:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
