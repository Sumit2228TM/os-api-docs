openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Collection Protocol"
  version: 1.0.0
  description: |
    Get Collection Protocol — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/CollectionProtocolsController.java` (`getCollectionProtocol`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/CollectionProtocolDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: CollectionProtocols
    description: "Operations from `CollectionProtocolsController.java`"
paths:
  /collection-protocols/{id}:
    get:
      operationId: getCollectionProtocol
      summary: getCollectionProtocol
      description: "GET /collection-protocols/{id} — `CollectionProtocolsController.java`.`getCollectionProtocol`"
      tags:
        - CollectionProtocols
      responses:
        '200':
          description: "Successful response for Get Collection Protocol"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionProtocolDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    shortTitle: BBCP
                    title: "Breast Cancer Biobank Protocol"
                    code: USER_ERROR
                    principalInvestigator:
                      id: 1001
                    startDate: "2024-10-22T14:30:00Z"
                    endDate: "2024-10-22T14:30:00Z"
                    participantCount: 1
                    specimenCount: 1
                    ppidFmt: sample-ppidfmt
                    manualPpidEnabled: false
                    specimenCentric: false
                    catalogId: 1001
                    starred: false
                    draftMode: false
                    groupWorkflowsInherited: false
                    coordinators:
                      - id: 1001
                    cpSites:
                      - id: 1001
                    consentsWaived: false
                    visitLevelConsents: false
                    consentsSource:
                      id: 1001
                    cpg:
                      id: 1001
                    requestManagerGroup:
                      id: 1001
                    irbId: 1001
                    anticipatedParticipantsCount: 1
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
