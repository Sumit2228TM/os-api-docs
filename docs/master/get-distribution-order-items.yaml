openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Distribution Order Items"
  description: |
    Get Distribution Order Items — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/DistributionOrderController.java` (`getOrderItems`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: DistributionOrder
    description: "Operations from `DistributionOrderController.java`"
paths:
  /distribution-orders/{id}/items:
    get:
      operationId: getOrderItems
      summary: getOrderItems
      description: "GET /distribution-orders/{id}/items — `DistributionOrderController.java`.`getOrderItems`"
      tags:
        - DistributionOrder
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: storedInDistributionContainer
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: startAt
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: "Get Distribution Order Items completed successfully (`GET /distribution-orders/{id}/items`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributionOrderItemDetail"
              example:
                - id: 1
                  specimen:
                    id: 1001
                    label: SPEC_001
        '400':
          description: "Request failed validation or business rules for `GET /distribution-orders/{id}/items` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Get Distribution Order Items, invalid identifiers in the path, or domain constraints on distribution orders."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                distributionValidation:
                  summary: "Distribution validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid distribution protocol or order data."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `GET /distribution-orders/{id}/items` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `GET /distribution-orders/{id}/items` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for distribution orders operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                distributionForbidden:
                  summary: "Distribution access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You do not have permission for this distribution protocol."
        '404':
          description: "No entity exists for the identifiers in `GET /distribution-orders/{id}/items` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                orderNotFound:
                  summary: "Order not found"
                  value:
                    - code: NOT_FOUND
                      message: "Distribution order not found."
        '500':
          description: "Unexpected failure while processing `GET /distribution-orders/{id}/items` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    DistributionOrderItemDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/DistributionOrderItemDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        orderName:
          type: string
        specimen:
          $ref: "#/components/schemas/SpecimenInfo"
        specimenLocation:
          type: string
        quantity:
          type: number
        cost:
          type: number
        label:
          type: string
        holdingLocation:
          $ref: "#/components/schemas/StorageLocationSummary"
        printLabel:
          type: boolean
        status:
          type: string
    SpecimenInfo:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/SpecimenInfo.java`"
      properties:
        id:
          type: integer
          format: int64
        cpId:
          type: integer
          format: int64
        cprId:
          type: integer
          format: int64
        ppid:
          type: string
        eventId:
          type: integer
          format: int64
        eventCode:
          type: string
        eventLabel:
          type: string
        visitId:
          type: integer
          format: int64
        visitName:
          type: string
        visitStatus:
          type: string
        sprNo:
          type: string
        visitDate:
          type: string
          format: date-time
        cpShortTitle:
          type: string
        reqId:
          type: integer
          format: int64
        sortOrder:
          type: integer
          format: int32
        label:
          type: string
        additionalLabel:
          type: string
        barcode:
          type: string
        type:
          type: string
        specimenClass:
          type: string
        lineage:
          type: string
        anatomicSite:
          type: string
        laterality:
          type: string
        status:
          type: string
        reqCode:
          type: string
        reqLabel:
          type: string
        pathology:
          type: string
        initialQty:
          type: number
        availableQty:
          type: number
        concentration:
          type: number
        quantityUnit:
          type: string
        concentrationUnit:
          type: string
        parentId:
          type: integer
          format: int64
        parentLabel:
          type: string
        storageLocation:
          $ref: "#/components/schemas/StorageLocationSummary"
        storageType:
          type: string
        collector:
          $ref: "#/components/schemas/UserSummary"
        collectionContainer:
          type: string
        collectionDate:
          type: string
          format: date-time
        receiver:
          $ref: "#/components/schemas/UserSummary"
        storageSite:
          type: string
        activityStatus:
          type: string
        createdOn:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/UserSummary"
        code:
