        lastModifiedBy:
          $ref: "#/components/schemas/UserSummary"
        lastModifiedOn:
          type: string
          format: date-time
        starred:
          type: boolean
        cpId:
          type: integer
          format: int64
        cpGroupId:
          type: integer
          format: int64
        drivingForm:
          type: string
        havingClause:
          type: string
        reporting:
          $ref: "#/components/schemas/ReportSpec"
        wideRowMode:
          type: string
        outputColumnExprs:
          type: boolean
        caseSensitive:
          type: boolean
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
