openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Specimen"
  version: 1.0.0
  description: |
    Get Specimen — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SpecimensController.java` (`getSpecimen`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/SpecimenDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: Specimens
    description: "Operations from `SpecimensController.java`"
paths:
  /specimens/{id}:
    get:
      operationId: getSpecimen
      summary: getSpecimen
      description: "GET /specimens/{id} — `SpecimensController.java`.`getSpecimen`"
      tags:
        - Specimens
      responses:
        '200':
          description: "Successful response for Get Specimen"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecimenDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    cpId: 101
                    cprId: 101
                    ppid: BBCP-001
                    eventId: 1101
                    eventCode: sample-eventcode
                    eventLabel: BBCP-2024-001-S1
                    visitId: 1001
                    visitName: sample-visitname
                    visitStatus: sample-visitstatus
                    sprNo: sample-sprno
                    visitDate: "2024-10-22T14:30:00Z"
                    cpShortTitle: sample-cpshorttitle
                    reqId: 1001
                    sortOrder: 1
                    label: BBCP-2024-001-S1
                    additionalLabel: BBCP-2024-001-S1
                    barcode: BBCP2024001S1
                    type: "Frozen Tissue"
                    specimenClass: Tissue
                    lineage: sample-lineage
                    anatomicSite: Breast
                    laterality: Left
                    status: PENDING
                    reqCode: sample-reqcode
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
