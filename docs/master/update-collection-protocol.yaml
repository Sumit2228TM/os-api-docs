openapi: 3.0.3
info:
  title: "OpenSpecimen API — Update Collection Protocol"
  description: |
    Update Collection Protocol — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/CollectionProtocolsController.java` (`updateCollectionProtocol`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/CollectionProtocolDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: CollectionProtocols
    description: "Operations from `CollectionProtocolsController.java`"
paths:
  /collection-protocols/{id}:
    put:
      operationId: updateCollectionProtocol
      summary: updateCollectionProtocol
      description: "PUT /collection-protocols/{id} — `CollectionProtocolsController.java`.`updateCollectionProtocol`"
      tags:
        - CollectionProtocols
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionProtocolDetail"
            example:
              principalInvestigator:
                id: 1
              shortTitle: ONC_STUDY_REV
              title: "Oncology Study Revised"
      responses:
        '200':
          description: "Update Collection Protocol completed successfully (`PUT /collection-protocols/{id}`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionProtocolDetail"
              example:
                principalInvestigator:
                  id: 1
                shortTitle: ONC_STUDY_REV
                title: "Oncology Study Revised"
                id: 1
        '400':
          description: "Request failed validation or business rules for `PUT /collection-protocols/{id}` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Update Collection Protocol, invalid identifiers in the path, or domain constraints on collection protocols."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestValidation:
                  summary: "Request validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid request for Update Collection Protocol."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `PUT /collection-protocols/{id}` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `PUT /collection-protocols/{id}` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for collection protocols operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accessDenied:
                  summary: "Access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You are not authorized for Update Collection Protocol."
        '404':
          description: "No entity exists for the identifiers in `PUT /collection-protocols/{id}` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  summary: "Resource not found"
                  value:
                    - code: NOT_FOUND
                      message: "Resource not found for PUT /collection-protocols/{id}."
        '500':
          description: "Unexpected failure while processing `PUT /collection-protocols/{id}` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  summary: "Internal error"
                  value:
                    - code: internal_error
                      message: "An unexpected error occurred."
