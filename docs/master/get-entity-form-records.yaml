openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Entity Form Records"
  version: 1.0.0
  description: |
    Get Entity Form Records — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SpecimensController.java` (`getFormRecords`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: Specimens
    description: "Operations from `SpecimensController.java`"
paths:
  /{entity}/{objectId}/forms/{formCtxtId}/records:
    get:
      operationId: getFormRecords
      summary: getFormRecords
      description: "GET /specimens/{id}/forms/{formCtxtId}/records — `SpecimensController.java`.`getFormRecords`"
      tags:
        - Specimens
      responses:
        '200':
          description: "Successful response for Get Entity Form Records"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityFormRecords"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    formId: 50
                    formCtxtId: 50
                    formCaption: sample-formcaption
                    records:
                      - id: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: formCtxtId
          in: path
          required: true
          schema:
            type: integer
            format: int64
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    EntityFormRecords:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/EntityFormRecords.java`"
      properties:
        formId:
          type: integer
          format: int64
        formCtxtId:
          type: integer
          format: int64
        formCaption:
          type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/FormRecordSummary"
    FormRecordSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/FormRecordSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        fcId:
          type: integer
          format: int64
        sysForm:
          type: boolean
        recordId:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/UserSummary"
        updateTime:
          type: string
          format: date-time
        entityType:
          type: string
        formId:
          type: integer
          format: int64
        formCaption:
          type: string
        formStatus:
          type: string
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        apiUser:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
