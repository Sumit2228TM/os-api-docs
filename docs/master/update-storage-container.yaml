openapi: 3.0.3
info:
  title: "OpenSpecimen API — Update Storage Container"
  description: |
    Update Storage Container — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/StorageContainersController.java` (`updateStorageContainer`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/StorageContainerDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: StorageContainers
    description: "Operations from `StorageContainersController.java`"
paths:
  /storage-containers/{id}:
    put:
      operationId: updateStorageContainer
      summary: updateStorageContainer
      description: "PUT /storage-containers/{id} — `StorageContainersController.java`.`updateStorageContainer`"
      tags:
        - StorageContainers
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageContainerDetail"
            example:
              name: Freezer_A_Box_01_RENAMED
              temperature: -80
      responses:
        '200':
          description: "Update Storage Container completed successfully (`PUT /storage-containers/{id}`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageContainerDetail"
              example:
                name: Freezer_A_Box_01_RENAMED
                temperature: -80
                id: 2001
        '400':
          description: "Request failed validation or business rules for `PUT /storage-containers/{id}` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Update Storage Container, invalid identifiers in the path, or domain constraints on storage containers."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                storageValidation:
                  summary: "Storage validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid storage container or position data."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `PUT /storage-containers/{id}` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `PUT /storage-containers/{id}` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for storage containers operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                storageAccessDenied:
                  summary: "Storage access denied"
                  value:
                    - code: SPECIMEN_CONTAINER_ACCESS_DENIED
                      message: "You do not have access to this container."
        '404':
          description: "No entity exists for the identifiers in `PUT /storage-containers/{id}` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                containerNotFound:
                  summary: "Container not found"
                  value:
                    - code: NOT_FOUND
                      message: "Storage container not found."
        '500':
          description: "Unexpected failure while processing `PUT /storage-containers/{id}` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
