openapi: 3.0.3
info:
  title: "OpenSpecimen API — Create Shipment"
  description: |
    Create Shipment — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/ShipmentController.java` (`createShipment`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ShipmentDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: Shipment
    description: "Operations from `ShipmentController.java`"
paths:
  /shipments:
    post:
      operationId: createShipment
      summary: createShipment
      description: "POST /shipments — `ShipmentController.java`.`createShipment`"
      tags:
        - Shipment
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentDetail"
            example:
              name: Shipment_101
              receivingSite: "Site B"
              sendingSite: "Site A"
              specimenIds:
                - 1001
      responses:
        '201':
          description: "Create Shipment completed successfully (`POST /shipments`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentDetail"
              example:
                name: Shipment_101
                receivingSite: "Site B"
                sendingSite: "Site A"
                specimenIds:
                  - 1001
                id: 9001
        '400':
          description: "Request failed validation or business rules for `POST /shipments` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Create Shipment, invalid identifiers in the path, or domain constraints on shipments."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestValidation:
                  summary: "Request validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid request for Create Shipment."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /shipments` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `POST /shipments` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for shipments operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accessDenied:
                  summary: "Access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You are not authorized for Create Shipment."
        '404':
          description: "No entity exists for the identifiers in `POST /shipments` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  summary: "Resource not found"
                  value:
                    - code: NOT_FOUND
                      message: "Resource not found for POST /shipments."
        '500':
          description: "Unexpected failure while processing `POST /shipments` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  summary: "Internal error"
                  value:
                    - code: internal_error
                      message: "An unexpected error occurred."
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
