openapi: 3.0.3
info:
  title: "OpenSpecimen API — Share Specimen List"
  version: 1.0.0
  description: |
    Share Specimen List — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SpecimenListsController.java` (`shareSpecimenList`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: SpecimenLists
    description: "Operations from `SpecimenListsController.java`"
paths:
  /specimen-lists/{id}/share:
    put:
      operationId: shareSpecimenList
      summary: shareSpecimenList
      description: "PUT /specimen-lists/{listId}/users — `SpecimenListsController.java`.`shareSpecimenList`"
      tags:
        - SpecimenLists
      responses:
        '200':
          description: "Successful response for Share Specimen List"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    - id: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: operation
          in: query
          required: false
          schema:
            type: string
            default: UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  - 1
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    List:
      type: object
      description: "Type `List` (Java source not found in repository)"
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        apiUser:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
