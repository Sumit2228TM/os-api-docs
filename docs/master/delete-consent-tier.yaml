openapi: 3.0.3
info:
  title: "OpenSpecimen API — Delete Consent Tier"
  description: |
    Delete Consent Tier — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/CollectionProtocolsController.java` (`removeConsentTier`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: CollectionProtocols
    description: "Operations from `CollectionProtocolsController.java`"
paths:
  /collection-protocols/{cpId}/consent-tiers/{tierId}:
    delete:
      operationId: removeConsentTier
      summary: removeConsentTier
      description: "DELETE /collection-protocols/{id}/consent-tiers/{tierId} — `CollectionProtocolsController.java`.`removeConsentTier`"
      tags:
        - CollectionProtocols
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tierId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "Delete Consent Tier completed successfully (`DELETE /collection-protocols/{cpId}/consent-tiers/{tierId}`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentTierDetail"
              example:
                deleted: true
        '400':
          description: "Request failed validation or business rules for `DELETE /collection-protocols/{cpId}/consent-tiers/{tierId}` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Delete Consent Tier, invalid identifiers in the path, or domain constraints on collection protocols."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestValidation:
                  summary: "Request validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid request for Delete Consent Tier."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `DELETE /collection-protocols/{cpId}/consent-tiers/{tierId}` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `DELETE /collection-protocols/{cpId}/consent-tiers/{tierId}` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for collection protocols operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accessDenied:
                  summary: "Access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You are not authorized for Delete Consent Tier."
        '404':
          description: "No entity exists for the identifiers in `DELETE /collection-protocols/{cpId}/consent-tiers/{tierId}` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  summary: "Resource not found"
                  value:
                    - code: NOT_FOUND
                      message: "Resource not found for DELETE /collection-protocols/{cpId}/consent-tiers/{tierId}."
        '500':
          description: "Unexpected failure while processing `DELETE /collection-protocols/{cpId}/consent-tiers/{tierId}` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  summary: "Internal error"
                  value:
                    - code: internal_error
                      message: "An unexpected error occurred."
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ConsentTierDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/ConsentTierDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        cpId:
          type: integer
          format: int64
        statementId:
          type: integer
          format: int64
        statementCode:
          type: string
        statement:
          type: string
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
