openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get All Sites"
  version: 1.0.0
  description: |
    Get All Sites — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SitesController.java` (`getSites`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: Sites
    description: "Operations from `SitesController.java`"
paths:
  /sites:
    get:
      operationId: getSites
      summary: getSites
      description: "GET /sites — `SitesController.java`.`getSites`"
      tags:
        - Sites
      responses:
        '200':
          description: "Successful response for Get All Sites"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteSummary"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    - id: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: name
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exactMatch
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: resource
          in: query
          required: false
          schema:
            type: string
        - name: operation
          in: query
          required: false
          schema:
            type: string
        - name: institute
          in: query
          required: false
          schema:
            type: string
        - name: startAt
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
        - name: listAll
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeType
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: excludeType
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: includeStats
          in: query
          required: false
          schema:
            type: boolean
            default: false
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    SiteSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/SiteSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        instituteName:
          type: string
        code:
          type: string
        type:
          type: string
        activityStatus:
          type: string
        cpCount:
          type: integer
          format: int32
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
