openapi: 3.0.3
info:
  title: "OpenSpecimen API — Create User"
  description: |
    Create User — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/UserController.java` (`createUser`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/UserDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: User
    description: "Operations from `UserController.java`"
paths:
  /users:
    post:
      operationId: createUser
      summary: createUser
      description: "POST /users — `UserController.java`.`createUser`"
      tags:
        - User
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDetail"
            example:
              domainName: openspecimen
              emailAddress: "jsmith@institution.edu"
              firstName: Jane
              lastName: Smith
              loginName: jsmith
      responses:
        '201':
          description: "Create User completed successfully (`POST /users`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
              example:
                domainName: openspecimen
                emailAddress: "jsmith@institution.edu"
                firstName: Jane
                lastName: Smith
                loginName: jsmith
                id: 42
        '400':
          description: "Request failed validation or business rules for `POST /users` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Create User, invalid identifiers in the path, or domain constraints on users."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userValidation:
                  summary: "User or role validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid user or RBAC payload."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /users` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `POST /users` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for users operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                adminForbidden:
                  summary: "Administrative access denied"
                  value:
                    - code: FORBIDDEN
                      message: "Administrative privilege required."
        '404':
          description: "No entity exists for the identifiers in `POST /users` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userRoleNotFound:
                  summary: "User or role not found"
                  value:
                    - code: NOT_FOUND
                      message: "User or role not found."
        '500':
          description: "Unexpected failure while processing `POST /users` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    UserDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/UserDetail.java`"
      properties:
        regularType:
          $ref: "#/components/schemas/static String"
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        emailAddress:
          type: string
        domainName:
          type: string
        loginName:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        type:
          type: string
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        dnd:
          type: boolean
        apiUser:
          type: boolean
        ipRange:
          type: string
        defaultPrinter:
          type: string
        downloadLabelsPrintFile:
          type: boolean
        address:
          type: string
        timeZone:
          type: string
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        userId:
          type: string
    static String:
      type: object
      description: "Type `static String` (Java source not found in repository)"
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
