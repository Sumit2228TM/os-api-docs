openapi: 3.0.3
info:
  title: "OpenSpecimen API — Delete Distribution Protocol"
  version: 1.0.0
  description: |
    Delete Distribution Protocol — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/DistributionProtocolController.java` (`deleteDistributionProtocol`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: DistributionProtocol
    description: "Operations from `DistributionProtocolController.java`"
paths:
  /distribution-protocols/{id}:
    delete:
      operationId: deleteDistributionProtocol
      summary: deleteDistributionProtocol
      description: "DELETE /distribution-protocols/{id} — `DistributionProtocolController.java`.`deleteDistributionProtocol`"
      tags:
        - DistributionProtocol
      responses:
        '200':
          description: "Successful response for Delete Distribution Protocol"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionProtocolDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    title: "Breast Cancer Biobank Protocol"
                    shortTitle: BBCP
                    principalInvestigator:
                      id: 1001
                    startDate: "2024-10-22T14:30:00Z"
                    endDate: "2024-10-22T14:30:00Z"
                    instituteName: sample-institutename
                    defReceivingSiteName: sample-defreceivingsitename
                    distributedSpecimensCount: 1
                    starred: false
                    coordinators:
                      - id: 1001
                    irbId: 1001
                    activityStatus: Active
                    report:
                      id: 1001
                    orderExtnForm:
                      id: 1001
                    disableEmailNotifs: false
                    attachmentType: sample-attachmenttype
                    orderItemLabelFormat: BBCP-2024-001-S1
                    extensionDetail:
                      id: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
components:
