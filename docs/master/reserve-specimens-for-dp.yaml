openapi: 3.0.3
info:
  title: "OpenSpecimen API — Reserve Specimens For DP"
  version: 1.0.0
  description: |
    Reserve Specimens For DP — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/DistributionProtocolController.java` (`reserveSpecimens`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ReserveSpecimensDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: DistributionProtocol
    description: "Operations from `DistributionProtocolController.java`"
paths:
  /distribution-protocols/{id}/reserved-specimens:
    put:
      operationId: reserveSpecimens
      summary: reserveSpecimens
      description: "PUT /distribution-protocols/{id}/reserved-specimens — `DistributionProtocolController.java`.`reserveSpecimens`"
      tags:
        - DistributionProtocol
      responses:
        '200':
          description: "Successful response for Reserve Specimens For DP"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:

        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveSpecimensDetail"
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  dpId: 801
                  dpShortTitle: sample-dpshorttitle
                  specimens:
                    - id: 1001
                  user:
                    id: 1001
                  time: "2024-10-22T14:30:00Z"
                  comments: sample-comments
                  cancelOp: false
