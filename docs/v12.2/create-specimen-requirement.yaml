openapi: 3.0.3
info:
  title: "OpenSpecimen API — Create Specimen Requirement"
  description: |
    Create Specimen Requirement — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SpecimenRequirementsController.java` (`addRequirement`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/SpecimenRequirementDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: SpecimenRequirements
    description: "Operations from `SpecimenRequirementsController.java`"
paths:
  /specimen-requirements:
    post:
      operationId: addRequirement
      summary: addRequirement
      description: "POST /specimen-requirements — `SpecimenRequirementsController.java`.`addRequirement`"
      tags:
        - SpecimenRequirements
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecimenRequirementDetail"
            example:
              eventId: 5
              initialQty: 10
              name: "Whole Blood SR"
              specimenClass: Fluid
              type: "Whole Blood"
      responses:
        '201':
          description: "Create Specimen Requirement completed successfully (`POST /specimen-requirements`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecimenRequirementDetail"
              example:
                eventId: 5
                initialQty: 10
                name: "Whole Blood SR"
                specimenClass: Fluid
                type: "Whole Blood"
                id: 12
        '400':
          description: "Request failed validation or business rules for `POST /specimen-requirements` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Create Specimen Requirement, invalid identifiers in the path, or domain constraints on specimen requirements."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestValidation:
                  summary: "Request validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid request for Create Specimen Requirement."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /specimen-requirements` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `POST /specimen-requirements` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for specimen requirements operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accessDenied:
                  summary: "Access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You are not authorized for Create Specimen Requirement."
        '404':
          description: "No entity exists for the identifiers in `POST /specimen-requirements` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  summary: "Resource not found"
                  value:
                    - code: NOT_FOUND
                      message: "Resource not found for POST /specimen-requirements."
        '500':
          description: "Unexpected failure while processing `POST /specimen-requirements` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  summary: "Internal error"
                  value:
                    - code: internal_error
                      message: "An unexpected error occurred."
