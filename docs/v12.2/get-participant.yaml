openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Participant"
  version: 1.0.0
  description: |
    Get Participant — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/ParticipantController.java` (`getParticipantById`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/ParticipantDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: Participant
    description: "Operations from `ParticipantController.java`"
paths:
  /participants/{id}:
    get:
      operationId: getParticipantById
      summary: getParticipantById
      description: "GET /participants/{id} — `ParticipantController.java`.`getParticipantById`"
      tags:
        - Participant
      responses:
        '200':
          description: "Successful response for Get Participant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    source: sample-source
                    firstName: Alex
                    lastName: Rivera
                    middleName: sample-middlename
                    emailAddress: "biobank.tech@example.org"
                    emailOptIn: false
                    phoneNumber: sample-phonenumber
                    textOptIn: false
                    textOptInConsent: false
                    birthDate: "2024-10-22T14:30:00Z"
                    deathDate: "2024-10-22T14:30:00Z"
                    gender: Male
                    races:
                      - sample-racesitem
                    vitalStatus: Alive
                    pmis:
                      - id: 1001
                    sexGenotype: sample-sexgenotype
                    ethnicities:
                      - sample-ethnicitiesitem
                    uid: 1001
                    activityStatus: Active
                    empi: sample-empi
                    phiAccess: false
                    registeredCps:
                      - id: 1001
                    extensionDetail:
                      id: 1001
                    stagedId: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    ParticipantDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/ParticipantDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        emailAddress:
          type: string
        emailOptIn:
          type: boolean
        phoneNumber:
          type: string
        textOptIn:
          type: boolean
        textOptInConsent:
          type: boolean
        birthDate:
          type: string
          format: date-time
        deathDate:
          type: string
          format: date-time
        gender:
          type: string
        races:
          type: array
          items:
            type: string
        vitalStatus:
          type: string
        pmis:
          type: array
          items:
            $ref: "#/components/schemas/PmiDetail"
        sexGenotype:
          type: string
        ethnicities:
          type: array
          items:
            type: string
        uid:
          type: string
        activityStatus:
          type: string
        empi:
          type: string
        phiAccess:
          type: boolean
        registeredCps:
          type: array
          items:
            $ref: "#/components/schemas/CprSummary"
        extensionDetail:
          $ref: "#/components/schemas/ExtensionDetail"
        stagedId:
          type: integer
          format: int64
        dataEntryStatus:
          type: string
        reqRegInfo:
          type: boolean
        forceDelete:
          type: boolean
    PmiDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/PmiDetail.java`"
      properties:

    CprSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/CprSummary.java`"
      properties:
        participant:
          $ref: "#/components/schemas/ParticipantSummary"
        id:
          type: integer
          format: int64
        cprId:
          type: integer
          format: int64
        registrationDate:
          type: string
          format: date-time
        ppid:
          type: string
        cpId:
          type: integer
          format: int64
        cpShortTitle:
          type: string
        scgCount:
          type: integer
          format: int64
        specimenCount:
          type: integer
          format: int64
    ParticipantSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/ParticipantSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
        empi:
          type: string
        uid:
          type: string
        emailAddress:
          type: string
        emailOptIn:
          type: boolean
        phoneNumber:
          type: string
        textOptIn:
          type: boolean
        textOptInConsent:
          type: boolean
        birthDate:
          type: string
          format: date-time
    ExtensionDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/ExtensionDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        objectId:
          type: integer
          format: int64
        formId:
          type: integer
          format: int64
        formCaption:
          type: string
        dataEntryStatus:
          type: string
        attrsMap:
          $ref: "#/components/schemas/Map"
        useUdn:
          type: boolean
        name:
          type: string
        udn:
          type: string
        caption:
          type: string
        value:

        type:
          type: string
        displayValue:
          type: string
        codedValue:
          type: string
    Map:
      type: object
      description: "Type `Map` (Java source not found in repository)"
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
