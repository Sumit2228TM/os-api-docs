openapi: 3.0.3
info:
  title: "OpenSpecimen API — Sign In"
  description: |
    Sign In — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/AuthenticationController.java` (`authenticate`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/auth/events/LoginDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  []
tags:
  - name: Authentication
    description: "Operations from `AuthenticationController.java`"
paths:
  /sessions:
    post:
      operationId: authenticate
      summary: authenticate
      description: "POST /sessions — `AuthenticationController.java`.`authenticate`"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDetail"
            example:
              domainName: openspecimen
              loginName: admin
              password: "LoginPassword123!"
      responses:
        '201':
          description: "Sign In completed successfully (`POST /sessions`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
              example:
                domainName: openspecimen
                loginName: admin
                password: "LoginPassword123!"
                id: 1
                token: session-token-example
                user:
                  id: 1
                  loginName: admin
        '400':
          description: "Invalid login payload or authentication failure for `POST /sessions` (`ErrorType.USER_ERROR`). Typical causes: unknown `loginName`, wrong password, locked account, or missing `domainName`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  summary: "Invalid credentials"
                  value:
                    - code: USER_ERROR
                      message: "Invalid login name or password."
        '401':
          description: "Not used for sign-in; unauthenticated clients may call `POST /sessions` without a token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                signInUnauthorized:
                  summary: "Not applicable for sign-in"
                  value:
                    - code: UNAUTHORIZED
                      message: "Not used for sign-in."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `POST /sessions` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for sessions operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: "No entity exists for the identifiers in `POST /sessions` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: "Unexpected failure while processing `POST /sessions` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LoginDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/auth/events/LoginDetail.java`"
      properties:
        emailAddress:
          type: string
        loginName:
          type: string
        password:
          type: string
        domainName:
          type: string
        ipAddress:
          type: string
        doNotGenerateToken:
          type: boolean
        apiUrl:
          type: string
        requestMethod:
          type: string
        deviceDetails:
          type: string
    Map:
      type: object
      description: "Type `Map` (Java source not found in repository)"
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
