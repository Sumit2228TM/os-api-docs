openapi: 3.0.3
info:
  title: "OpenSpecimen API — Sign In"
  version: 1.0.0
  description: |
    Sign In — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/AuthenticationController.java` (`authenticate`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/auth/events/LoginDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: Authentication
    description: "Operations from `AuthenticationController.java`"
paths:
  /sessions:
    post:
      operationId: authenticate
      summary: authenticate
      description: "POST /sessions — `AuthenticationController.java`.`authenticate`"
      tags:
        - Authentication
      responses:
        '200':
          description: "Successful response for Sign In"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:

        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDetail"
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  emailAddress: "biobank.tech@example.org"
                  loginName: biobank.tech
                  password: "ChangeMe!2024"
                  domainName: sample-domainname
                  ipAddress: 192.168.10.45
                  doNotGenerateToken: false
                  apiUrl: sample-apiurl
                  requestMethod: sample-requestmethod
                  deviceDetails: "Chrome 129 / macOS"
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    LoginDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/auth/events/LoginDetail.java`"
      properties:
        emailAddress:
          type: string
        loginName:
          type: string
        password:
          type: string
        domainName:
          type: string
        ipAddress:
          type: string
        doNotGenerateToken:
          type: boolean
        apiUrl:
          type: string
        requestMethod:
          type: string
        deviceDetails:
          type: string
    Map:
      type: object
      description: "Type `Map` (Java source not found in repository)"
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
