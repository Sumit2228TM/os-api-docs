openapi: 3.0.3
info:
  title: "OpenSpecimen API — Change User Password"
  version: 1.0.0
  description: |
    Change User Password — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/UserController.java` (`changePassword`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/PasswordDetails.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: User
    description: "Operations from `UserController.java`"
paths:
  /users/{id}/password:
    put:
      operationId: changePassword
      summary: changePassword
      description: "PUT /users/password — `UserController.java`.`changePassword`"
      tags:
        - User
      responses:
        '200':
          description: "Successful response for Change User Password"
          content:
            application/json:
              schema:
                type: boolean
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value: false
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordDetails"
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  userId: 42
                  loginName: biobank.tech
                  oldPassword: "ChangeMe!2024"
                  newPassword: "ChangeMe!2024"
                  resetPasswordToken: "ChangeMe!2024"
                  ipAddress: 192.168.10.45
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    PasswordDetails:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/PasswordDetails.java`"
      properties:
        userId:
          type: integer
          format: int64
        loginName:
          type: string
        oldPassword:
          type: string
        newPassword:
          type: string
        resetPasswordToken:
          type: string
        ipAddress:
          type: string
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
