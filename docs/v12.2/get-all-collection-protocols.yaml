openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get All Collection Protocols"
  version: 1.0.0
  description: |
    Get All Collection Protocols — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/CollectionProtocolsController.java` (`getCollectionProtocols`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: CollectionProtocols
    description: "Operations from `CollectionProtocolsController.java`"
paths:
  /collection-protocols:
    get:
      operationId: getCollectionProtocols
      summary: getCollectionProtocols
      description: "GET /collection-protocols — `CollectionProtocolsController.java`.`getCollectionProtocols`"
      tags:
        - CollectionProtocols
      responses:
        '200':
          description: "Successful response for Get All Collection Protocols"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionProtocolSummary"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    - id: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: irbId
          in: query
          required: false
          schema:
            type: string
        - name: piId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: repositoryName
          in: query
          required: false
          schema:
            type: string
        - name: instituteId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: startAt
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
        - name: detailedList
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: orderByStarred
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: onlyParticipantConsentCps
          in: query
          required: false
          schema:
            type: boolean
            default: false
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    CollectionProtocolSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/CollectionProtocolSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        shortTitle:
          type: string
        title:
          type: string
        code:
          type: string
        principalInvestigator:
          $ref: "#/components/schemas/UserSummary"
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        participantCount:
          type: integer
          format: int64
        specimenCount:
          type: integer
          format: int64
        ppidFmt:
          type: string
        manualPpidEnabled:
          type: boolean
        specimenCentric:
          type: boolean
        catalogId:
          type: integer
          format: int64
        starred:
          type: boolean
        draftMode:
          type: boolean
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
