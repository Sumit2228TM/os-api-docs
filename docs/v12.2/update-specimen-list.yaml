openapi: 3.0.3
info:
  title: "OpenSpecimen API — Update Specimen List"
  description: |
    Update Specimen List — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SpecimenListsController.java` (`updateSpecimenList`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/SpecimenListDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: SpecimenLists
    description: "Operations from `SpecimenListsController.java`"
paths:
  /specimen-lists/{id}:
    put:
      operationId: updateSpecimenList
      summary: updateSpecimenList
      description: "PUT /specimen-lists/{listId} — `SpecimenListsController.java`.`updateSpecimenList`"
      tags:
        - SpecimenLists
      security:
        - ApiToken: []
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecimenListDetail"
            example:
              name: "High Priority Aliquots V2"
      responses:
        '200':
          description: "Update Specimen List completed successfully (`PUT /specimen-lists/{id}`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecimenListDetail"
              example:
                name: "High Priority Aliquots V2"
                id: 1
        '400':
          description: "Request failed validation or business rules for `PUT /specimen-lists/{id}` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Update Specimen List, invalid identifiers in the path, or domain constraints on specimen lists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestValidation:
                  summary: "Request validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid request for Update Specimen List."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `PUT /specimen-lists/{id}` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `PUT /specimen-lists/{id}` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for specimen lists operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accessDenied:
                  summary: "Access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You are not authorized for Update Specimen List."
        '404':
          description: "No entity exists for the identifiers in `PUT /specimen-lists/{id}` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  summary: "Resource not found"
                  value:
                    - code: NOT_FOUND
                      message: "Resource not found for PUT /specimen-lists/{id}."
        '500':
          description: "Unexpected failure while processing `PUT /specimen-lists/{id}` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  summary: "Internal error"
                  value:
                    - code: internal_error
                      message: "An unexpected error occurred."
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SpecimenListDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/SpecimenListDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        createdOn:
          type: string
          format: date-time
        lastUpdatedOn:
          type: string
          format: date-time
        owner:
          $ref: "#/components/schemas/UserSummary"
        defaultList:
          type: boolean
        specimenCount:
          type: integer
          format: int32
        starred:
          type: boolean
        sendDigestNotifs:
          type: boolean
        sourceEntityType:
          type: string
        sourceEntityId:
          type: integer
          format: int64
        sharedWith:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        sharedWithGroups:
          type: array
          items:
            $ref: "#/components/schemas/UserGroupSummary"
        specimenIds:
          type: array
          items:
            type: integer
            format: int64
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    UserGroupSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/UserGroupSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        institute:
          type: string
        noOfUsers:
          type: integer
          format: int32
        activityStatus:
          type: string
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
