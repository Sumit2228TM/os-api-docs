openapi: 3.0.3
info:
  title: "OpenSpecimen API — Update Container Type"
  version: 1.0.0
  description: |
    Update Container Type — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/ContainerTypesController.java` (`updateContainerType`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ContainerTypeDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: ContainerTypes
    description: "Operations from `ContainerTypesController.java`"
paths:
  /container-types/{id}:
    put:
      operationId: updateContainerType
      summary: updateContainerType
      description: "PUT /container-types/{id} — `ContainerTypesController.java`.`updateContainerType`"
      tags:
        - ContainerTypes
      responses:
        '200':
          description: "Successful response for Update Container Type"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerTypeDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    name: "Baseline Visit 1"
                    nameFormat: sample-nameformat
                    noOfColumns: 1
                    noOfRows: 1
                    positionLabelingMode: BBCP-2024-001-S1
                    positionAssignment: sample-positionassignment
                    columnLabelingScheme: BBCP-2024-001-S1
                    rowLabelingScheme: BBCP-2024-001-S1
                    temperature: 1.0
                    storeSpecimenEnabled: false
                    activityStatus: Active
                    canHold:
                      id: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerTypeDetail"
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  id: 1001
                  name: "Baseline Visit 1"
                  nameFormat: sample-nameformat
                  noOfColumns: 1
                  noOfRows: 1
                  positionLabelingMode: BBCP-2024-001-S1
                  positionAssignment: sample-positionassignment
                  columnLabelingScheme: BBCP-2024-001-S1
                  rowLabelingScheme: BBCP-2024-001-S1
                  temperature: 1.0
                  storeSpecimenEnabled: false
                  activityStatus: Active
                  canHold:
                    id: 1001
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    ContainerTypeDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ContainerTypeDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameFormat:
          type: string
        noOfColumns:
          type: integer
          format: int32
        noOfRows:
          type: integer
          format: int32
        positionLabelingMode:
          type: string
        positionAssignment:
          type: string
        columnLabelingScheme:
          type: string
        rowLabelingScheme:
          type: string
        temperature:
          type: number
          format: double
        storeSpecimenEnabled:
          type: boolean
        activityStatus:
          type: string
        canHold:
          $ref: "#/components/schemas/ContainerTypeSummary"
    ContainerTypeSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ContainerTypeSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameFormat:
          type: string
        noOfColumns:
          type: integer
          format: int32
        noOfRows:
          type: integer
          format: int32
        positionLabelingMode:
          type: string
        positionAssignment:
          type: string
        columnLabelingScheme:
          type: string
        rowLabelingScheme:
          type: string
        temperature:
          type: number
          format: double
        storeSpecimenEnabled:
          type: boolean
        activityStatus:
          type: string
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
