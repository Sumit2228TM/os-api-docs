openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Specimens"
  version: 1.0.0
  description: |
    Get Specimens — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SpecimensController.java` (`getSpecimens`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: Specimens
    description: "Operations from `SpecimensController.java`"
paths:
  /specimens:
    get:
      operationId: getSpecimens
      summary: getSpecimens
      description: "GET /specimens — `SpecimensController.java`.`getSpecimens`"
      tags:
        - Specimens
      responses:
        '200':
          description: "Successful response for Get Specimens"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/?"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    - id: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: cpId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: cprId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: eventId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: visitId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: storageLocationSite
          in: query
          required: false
          schema:
            type: string
        - name: id
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: label
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: barcode
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exactMatch
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeExtensions
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: minimalInfo
          in: query
          required: false
          schema:
            type: boolean
            default: false
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    ?:
      type: object
      description: "Type `?` (Java source not found in repository)"
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
