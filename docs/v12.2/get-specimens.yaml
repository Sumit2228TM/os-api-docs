openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Specimens"
  description: |
    Get Specimens — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SpecimensController.java` (`getSpecimens`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: Specimens
    description: "Operations from `SpecimensController.java`"
paths:
  /specimens:
    get:
      operationId: getSpecimens
      summary: getSpecimens
      description: "GET /specimens — `SpecimensController.java`.`getSpecimens`"
      tags:
        - Specimens
      security:
        - ApiToken: []
      parameters:
        - name: cpId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: cprId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: eventId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: visitId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: storageLocationSite
          in: query
          required: false
          schema:
            type: string
        - name: id
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: label
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: barcode
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exactMatch
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeExtensions
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: minimalInfo
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: "Get Specimens completed successfully (`GET /specimens`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/?"
              example:
                []
        '400':
          description: "Request failed validation or business rules for `GET /specimens` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Get Specimens, invalid identifiers in the path, or domain constraints on specimens. Examples: `SPECIMEN_LABEL_REQUIRED`, `SPECIMEN_DUP_LABEL`, insufficient quantity, or invalid status transition."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                specimenValidation:
                  summary: "Specimen validation failed"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `GET /specimens` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `GET /specimens` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for specimens operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                specimenAccessDenied:
                  summary: "Specimen access denied"
                  value:
                    - code: SPECIMEN_ACCESS_DENIED
                      message: "You do not have access to this specimen."
        '404':
          description: "No rows matched filters for `GET /specimens` (`ErrorType.NOT_FOUND` or empty list depending on endpoint). Adjust query parameters such as name, label, or cpId."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                specimenNotFound:
                  summary: "Specimen not found"
                  value:
                    - code: NOT_FOUND
                      message: "Specimen not found for the given id."
        '500':
          description: "Unexpected failure while processing `GET /specimens` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ?:
      type: object
      description: "Type `?` (Java source not found in repository)"
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
