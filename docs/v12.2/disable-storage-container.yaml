openapi: 3.0.3
info:
  title: "OpenSpecimen API — Disable Storage Container"
  description: |
    Disable Storage Container — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/StorageContainersController.java` (`deleteStorageContainer`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: StorageContainers
    description: "Operations from `StorageContainersController.java`"
paths:
  /storage-containers/{id}:
    delete:
      operationId: deleteStorageContainer
      summary: deleteStorageContainer
      description: "DELETE /storage-containers/{id} — `StorageContainersController.java`.`deleteStorageContainer`"
      tags:
        - StorageContainers
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: forceDelete
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: "Disable Storage Container completed successfully (`DELETE /storage-containers/{id}`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
              example:
                activityStatus: Disabled
                deleted: true
        '400':
          description: "Request failed validation or business rules for `DELETE /storage-containers/{id}` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Disable Storage Container, invalid identifiers in the path, or domain constraints on storage containers."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                storageValidation:
                  summary: "Storage validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid storage container or position data."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `DELETE /storage-containers/{id}` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `DELETE /storage-containers/{id}` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for storage containers operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                storageAccessDenied:
                  summary: "Storage access denied"
                  value:
                    - code: SPECIMEN_CONTAINER_ACCESS_DENIED
                      message: "You do not have access to this container."
        '404':
          description: "No entity exists for the identifiers in `DELETE /storage-containers/{id}` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                containerNotFound:
                  summary: "Container not found"
                  value:
                    - code: NOT_FOUND
                      message: "Storage container not found."
        '500':
          description: "Unexpected failure while processing `DELETE /storage-containers/{id}` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Map:
      type: object
      description: "Type `Map` (Java source not found in repository)"
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
