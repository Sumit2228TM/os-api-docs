openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Specimen Dependent Entities"
  description: |
    Get Specimen Dependent Entities — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SpecimensController.java` (`getDependentEntities`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: Specimens
    description: "Operations from `SpecimensController.java`"
paths:
  /specimens/{id}/dependent-entities:
    get:
      operationId: getDependentEntities
      summary: getDependentEntities
      description: "GET /specimens/{id}/dependent-entities — `SpecimensController.java`.`getDependentEntities`"
      tags:
        - Specimens
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "Get Specimen Dependent Entities completed successfully (`GET /specimens/{id}/dependent-entities`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DependentEntityDetail"
              example:
                distributionOrders:
                  []
                shipments:
                  []
                childSpecimens:
                  - id: 1002
                    label: SPEC_001-A1
        '400':
          description: "Request failed validation or business rules for `GET /specimens/{id}/dependent-entities` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Get Specimen Dependent Entities, invalid identifiers in the path, or domain constraints on specimens. Examples: `SPECIMEN_LABEL_REQUIRED`, `SPECIMEN_DUP_LABEL`, insufficient quantity, or invalid status transition."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                specimenValidation:
                  summary: "Specimen validation failed"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `GET /specimens/{id}/dependent-entities` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `GET /specimens/{id}/dependent-entities` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for specimens operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                specimenAccessDenied:
                  summary: "Specimen access denied"
                  value:
                    - code: SPECIMEN_ACCESS_DENIED
                      message: "You do not have access to this specimen."
        '404':
          description: "No entity exists for the identifiers in `GET /specimens/{id}/dependent-entities` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                specimenNotFound:
                  summary: "Specimen not found"
                  value:
                    - code: NOT_FOUND
                      message: "Specimen not found for the given id."
        '500':
          description: "Unexpected failure while processing `GET /specimens/{id}/dependent-entities` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    DependentEntityDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/DependentEntityDetail.java`"
      properties:
        name:
          type: string
        count:
          type: integer
          format: int32
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
