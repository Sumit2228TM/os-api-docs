openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get CPR List"
  version: 1.0.0
  description: |
    Get CPR List — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/CollectionProtocolRegistrationsController.java` (`getRegistrations`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: CollectionProtocolRegistrations
    description: "Operations from `CollectionProtocolRegistrationsController.java`"
paths:
  /collection-protocol-registrations:
    get:
      operationId: getRegistrations
      summary: getRegistrations
      description: "GET /collection-protocol-registrations — `CollectionProtocolRegistrationsController.java`.`getRegistrations`"
      tags:
        - CollectionProtocolRegistrations
      responses:
        '200':
          description: "Successful response for Get CPR List"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionProtocolRegistrationDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    - id: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
