openapi: 3.0.3
info:
  title: "OpenSpecimen API — Run Scheduled Job"
  version: 1.0.0
  description: |
    Run Scheduled Job — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/ScheduledJobsController.java` (`executeJob`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ScheduledJobDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: ScheduledJobs
    description: "Operations from `ScheduledJobsController.java`"
paths:
  /scheduled-jobs/{jobId}/runs:
    post:
      operationId: executeJob
      summary: executeJob
      description: "POST /scheduled-jobs/{jobId}/runs — `ScheduledJobsController.java`.`executeJob`"
      tags:
        - ScheduledJobs
      responses:
        '200':
          description: "Successful response for Run Scheduled Job"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledJobDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    name: "Baseline Visit 1"
                    createdBy:
                      id: 1001
                    startDate: "2024-10-22T14:30:00Z"
                    endDate: "2024-10-22T14:30:00Z"
                    scheduledHour: 1
                    scheduledMinute: 1
                    scheduledDayOfWeek: sample-scheduleddayofweek
                    scheduledDayOfMonth: 1
                    hourlyInterval: 1
                    minutelyInterval: 1
                    nextRunOn: "2024-10-22T14:30:00Z"
                    activityStatus: Active
                    repeatSchedule: sample-repeatschedule
                    type: "Frozen Tissue"
                    taskImplFqn: sample-taskimplfqn
                    command: sample-command
                    fixedArgs: sample-fixedargs
                    savedQuery:
                      id: 1001
                    runAs:
                      id: 1001
                    isActiveJob: false
                    lastRunOn: "2024-10-22T14:30:00Z"
                    rtArgsProvided: false
                    rtArgsHelpText: sample-rtargshelptext
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledJobDetail"
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  id: 1001
                  name: "Baseline Visit 1"
                  createdBy:
                    id: 1001
                  startDate: "2024-10-22T14:30:00Z"
                  endDate: "2024-10-22T14:30:00Z"
                  scheduledHour: 1
                  scheduledMinute: 1
                  scheduledDayOfWeek: sample-scheduleddayofweek
                  scheduledDayOfMonth: 1
                  hourlyInterval: 1
                  minutelyInterval: 1
                  nextRunOn: "2024-10-22T14:30:00Z"
                  activityStatus: Active
                  repeatSchedule: sample-repeatschedule
                  type: "Frozen Tissue"
                  taskImplFqn: sample-taskimplfqn
                  command: sample-command
                  fixedArgs: sample-fixedargs
                  savedQuery:
                    id: 1001
                  runAs:
                    id: 1001
                  isActiveJob: false
                  lastRunOn: "2024-10-22T14:30:00Z"
                  rtArgsProvided: false
                  rtArgsHelpText: sample-rtargshelptext
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    ScheduledJobDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ScheduledJobDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdBy:
          $ref: "#/components/schemas/UserSummary"
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        scheduledHour:
          type: integer
          format: int32
        scheduledMinute:
          type: integer
          format: int32
        scheduledDayOfWeek:
          type: string
        scheduledDayOfMonth:
          type: integer
          format: int32
        hourlyInterval:
          type: integer
          format: int32
        minutelyInterval:
          type: integer
          format: int32
        nextRunOn:
          type: string
          format: date-time
        activityStatus:
          type: string
        repeatSchedule:
          type: string
        type:
          type: string
        taskImplFqn:
          type: string
        command:
          type: string
        fixedArgs:
          type: string
        savedQuery:
          $ref: "#/components/schemas/SavedQuerySummary"
        runAs:
          $ref: "#/components/schemas/UserSummary"
        isActiveJob:
          type: boolean
        lastRunOn:
          type: string
          format: date-time
        rtArgsProvided:
          type: boolean
        rtArgsHelpText:
          type: string
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    SavedQuerySummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/SavedQuerySummary.java`"
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        createdBy:
          $ref: "#/components/schemas/UserSummary"
        lastModifiedBy:
          $ref: "#/components/schemas/UserSummary"
        lastModifiedOn:
          type: string
          format: date-time
        starred:
          type: boolean
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
