openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Container Type"
  description: |
    Get Container Type — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/ContainerTypesController.java` (`getContainerType`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ContainerTypeDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: ContainerTypes
    description: "Operations from `ContainerTypesController.java`"
paths:
  /container-types/{id}:
    get:
      operationId: getContainerType
      summary: getContainerType
      description: "GET /container-types/{id} — `ContainerTypesController.java`.`getContainerType`"
      tags:
        - ContainerTypes
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "Get Container Type completed successfully (`GET /container-types/{id}`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerTypeDetail"
              example:
                id: 1
                name: "9x9 Box"
                noOfRows: 9
                noOfColumns: 9
        '400':
          description: "Request failed validation or business rules for `GET /container-types/{id}` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Get Container Type, invalid identifiers in the path, or domain constraints on container types."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                storageValidation:
                  summary: "Storage validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid storage container or position data."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `GET /container-types/{id}` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `GET /container-types/{id}` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for container types operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                storageAccessDenied:
                  summary: "Storage access denied"
                  value:
                    - code: SPECIMEN_CONTAINER_ACCESS_DENIED
                      message: "You do not have access to this container."
        '404':
          description: "No entity exists for the identifiers in `GET /container-types/{id}` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                containerNotFound:
                  summary: "Container not found"
                  value:
                    - code: NOT_FOUND
                      message: "Storage container not found."
        '500':
          description: "Unexpected failure while processing `GET /container-types/{id}` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ContainerTypeDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ContainerTypeDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameFormat:
          type: string
        noOfColumns:
          type: integer
          format: int32
        noOfRows:
          type: integer
          format: int32
        positionLabelingMode:
          type: string
        positionAssignment:
          type: string
        columnLabelingScheme:
          type: string
        rowLabelingScheme:
          type: string
        temperature:
          type: number
          format: double
        storeSpecimenEnabled:
          type: boolean
        activityStatus:
          type: string
        canHold:
          $ref: "#/components/schemas/ContainerTypeSummary"
    ContainerTypeSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ContainerTypeSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameFormat:
          type: string
        noOfColumns:
          type: integer
          format: int32
        noOfRows:
          type: integer
          format: int32
        positionLabelingMode:
          type: string
        positionAssignment:
          type: string
        columnLabelingScheme:
          type: string
        rowLabelingScheme:
          type: string
        temperature:
          type: number
          format: double
        storeSpecimenEnabled:
          type: boolean
        activityStatus:
          type: string
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
