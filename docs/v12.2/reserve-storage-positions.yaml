openapi: 3.0.3
info:
  title: "OpenSpecimen API — Reserve Storage Positions"
  description: |
    Reserve Storage Positions — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/StorageContainersController.java` (`reservePositions`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ReservePositionsOp.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: StorageContainers
    description: "Operations from `StorageContainersController.java`"
paths:
  /storage-containers/reserve-positions:
    post:
      operationId: reservePositions
      summary: reservePositions
      description: "POST /storage-containers/reserve-positions — `StorageContainersController.java`.`reservePositions`"
      tags:
        - StorageContainers
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservePositionsOp"
            example:
              cpId: 1
              specimenCount: 5
      responses:
        '200':
          description: "Reserve Storage Positions completed successfully (`POST /storage-containers/reserve-positions`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageLocationSummary"
              example:
                cpId: 1
                specimenCount: 5
                id: 2001
                reservedCount: 5
        '400':
          description: "Request failed validation or business rules for `POST /storage-containers/reserve-positions` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Reserve Storage Positions, invalid identifiers in the path, or domain constraints on storage containers."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                storageValidation:
                  summary: "Storage validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid storage container or position data."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /storage-containers/reserve-positions` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `POST /storage-containers/reserve-positions` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for storage containers operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                storageAccessDenied:
                  summary: "Storage access denied"
                  value:
                    - code: SPECIMEN_CONTAINER_ACCESS_DENIED
                      message: "You do not have access to this container."
        '404':
          description: "No entity exists for the identifiers in `POST /storage-containers/reserve-positions` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                containerNotFound:
                  summary: "Container not found"
                  value:
                    - code: NOT_FOUND
                      message: "Storage container not found."
        '500':
          description: "Unexpected failure while processing `POST /storage-containers/reserve-positions` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ReservePositionsOp:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/ReservePositionsOp.java`"
      properties:
        cpId:
          type: integer
          format: int64
        reservationToCancel:
          type: string
    StorageLocationSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/StorageLocationSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
        barcode:
          type: string
        mode:
          type: string
        positionX:
          type: string
        positionY:
          type: string
        position:
          type: integer
          format: int32
        reservationId:
          type: string
        checkoutBy:
          $ref: "#/components/schemas/UserSummary"
        checkoutTime:
          type: string
          format: date-time
        checkoutComments:
          type: string
        siteId:
          type: integer
          format: int64
        siteName:
          type: string
        formattedPosition:
          type: string
        hierarchy:
          type: string
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
