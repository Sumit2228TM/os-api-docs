openapi: 3.0.3
info:
  title: "OpenSpecimen API — Assign User Role"
  description: |
    Assign User Role — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/RbacController.java` (`addSubjectRole`).
    DTO: `WEB-INF/src/com/krishagni/rbac/events/SubjectRoleDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: Rbac
    description: "Operations from `RbacController.java`"
paths:
  /rbac/subjects/{userId}/roles:
    post:
      operationId: addSubjectRole
      summary: addSubjectRole
      description: "POST /rbac/subjects/{id}/roles — `RbacController.java`.`addSubjectRole`"
      tags:
        - Rbac
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectRoleDetail"
            example:
              cpId: 1
              roleId: 3
              siteId: 10
      responses:
        '201':
          description: "Assign User Role completed successfully (`POST /rbac/subjects/{userId}/roles`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectRoleDetail"
              example:
                cpId: 1
                roleId: 3
                siteId: 10
                id: 1
        '400':
          description: "Request failed validation or business rules for `POST /rbac/subjects/{userId}/roles` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Assign User Role, invalid identifiers in the path, or domain constraints on rbac."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userValidation:
                  summary: "User or role validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid user or RBAC payload."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /rbac/subjects/{userId}/roles` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Caller cannot administer roles for `POST /rbac/subjects/{userId}/roles`. Requires administrative privileges to modify RBAC definitions or subject role bindings."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                adminForbidden:
                  summary: "Administrative access denied"
                  value:
                    - code: FORBIDDEN
                      message: "Administrative privilege required."
        '404':
          description: "No entity exists for the identifiers in `POST /rbac/subjects/{userId}/roles` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userRoleNotFound:
                  summary: "User or role not found"
                  value:
                    - code: NOT_FOUND
                      message: "User or role not found."
        '500':
          description: "Unexpected failure while processing `POST /rbac/subjects/{userId}/roles` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SubjectRoleDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/rbac/events/SubjectRoleDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        role:
          $ref: "#/components/schemas/RoleDetail"
        collectionProtocol:
          $ref: "#/components/schemas/CollectionProtocolSummary"
        site:
          $ref: "#/components/schemas/SiteDetail"
        systemRole:
          type: boolean
    RoleDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/rbac/events/RoleDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    CollectionProtocolSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/CollectionProtocolSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        shortTitle:
          type: string
        title:
          type: string
        code:
          type: string
        principalInvestigator:
