openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Entity Form Records"
  description: |
    Get Entity Form Records — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SpecimensController.java` (`getFormRecords`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: Specimens
    description: "Operations from `SpecimensController.java`"
paths:
  /{entity}/{objectId}/forms/{formCtxtId}/records:
    get:
      operationId: getFormRecords
      summary: getFormRecords
      description: "GET /specimens/{id}/forms/{formCtxtId}/records — `SpecimensController.java`.`getFormRecords`"
      tags:
        - Specimens
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: formCtxtId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "Get Entity Form Records completed successfully (`GET /{entity}/{objectId}/forms/{formCtxtId}/records`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityFormRecords"
              example:
                - recordId: 101
                  smokingStatus: "Former Smoker"
        '400':
          description: "Request failed validation or business rules for `GET /{entity}/{objectId}/forms/{formCtxtId}/records` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Get Entity Form Records, invalid identifiers in the path, or domain constraints on {entity}."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestValidation:
                  summary: "Request validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid request for Get Entity Form Records."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `GET /{entity}/{objectId}/forms/{formCtxtId}/records` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `GET /{entity}/{objectId}/forms/{formCtxtId}/records` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for {entity} operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accessDenied:
                  summary: "Access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You are not authorized for Get Entity Form Records."
        '404':
          description: "No entity exists for the identifiers in `GET /{entity}/{objectId}/forms/{formCtxtId}/records` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  summary: "Resource not found"
                  value:
                    - code: NOT_FOUND
                      message: "Resource not found for GET /{entity}/{objectId}/forms/{formCtxtId}/records."
        '500':
          description: "Unexpected failure while processing `GET /{entity}/{objectId}/forms/{formCtxtId}/records` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  summary: "Internal error"
                  value:
                    - code: internal_error
                      message: "An unexpected error occurred."
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    EntityFormRecords:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/EntityFormRecords.java`"
      properties:
        formId:
          type: integer
          format: int64
        formCtxtId:
          type: integer
          format: int64
        formCaption:
          type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/FormRecordSummary"
    FormRecordSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/FormRecordSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        fcId:
          type: integer
          format: int64
        sysForm:
          type: boolean
        recordId:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/UserSummary"
        updateTime:
          type: string
          format: date-time
        entityType:
          type: string
        formId:
          type: integer
          format: int64
        formCaption:
          type: string
        formStatus:
          type: string
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
