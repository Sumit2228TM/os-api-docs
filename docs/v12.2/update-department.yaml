openapi: 3.0.3
info:
  title: "OpenSpecimen API — Update Department"
  version: 1.0.0
  description: |
    Update Department — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/InstitutesController.java` (`catalogOp`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/InstituteDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: Institutes
    description: "Operations from `InstitutesController.java`"
paths:
  /departments/{id}:
    put:
      operationId: updateDepartment
      summary: "Update Department"
      description: "Catalog endpoint `PUT /departments/{id}` documented for OpenSpecimen core API. Java `@RequestMapping` may differ or be absent on this branch; schemas/examples follow the catalog DTO."
      tags:
        - Institutes
      responses:
        '200':
          description: "Successful response for Update Department"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstituteDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    name: "Baseline Visit 1"
                    activityStatus: Active
                    usersCount: 1
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstituteDetail"
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  id: 1001
                  name: "Baseline Visit 1"
                  activityStatus: Active
                  usersCount: 1
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    InstituteDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/InstituteDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        activityStatus:
          type: string
        usersCount:
          type: integer
          format: int32
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
