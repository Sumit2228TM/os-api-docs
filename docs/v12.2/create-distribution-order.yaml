openapi: 3.0.3
info:
  title: "OpenSpecimen API — Create Distribution Order"
  version: 1.0.0
  description: |
    Create Distribution Order — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/DistributionOrderController.java` (`createDistribution`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/DistributionOrderDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: DistributionOrder
    description: "Operations from `DistributionOrderController.java`"
paths:
  /distribution-orders:
    post:
      operationId: createDistribution
      summary: createDistribution
      description: "POST /distribution-orders — `DistributionOrderController.java`.`createDistribution`"
      tags:
        - DistributionOrder
      responses:
        '200':
          description: "Successful response for Create Distribution Order"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionOrderDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    name: "Baseline Visit 1"
                    distributionProtocol:
                      id: 1001
                    instituteName: sample-institutename
                    siteId: 7
                    siteName: sample-sitename
                    requester:
                      id: 1001
                    creationDate: "2024-10-22T14:30:00Z"
                    executionDate: "2024-10-22T14:30:00Z"
                    status: PENDING
                    distributor:
                      id: 1001
                    trackingUrl: sample-trackingurl
                    comments: sample-comments
                    request:
                      id: 1001
                    specimenList:
                      id: 1001
                    allReservedSpmns: false
                    clearListId: 1001
                    clearListMode: sample-clearlistmode
                    activityStatus: Active
                    extraAttrs:
                      id: 1001
                    extensionDetail:
                      id: 1001
                    orderItem:
                      id: 1001
                    async: false
                    copyItemsFromExistingOrder: false
                    distributeAvailableQty: false
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      requestBody:
        required: true
        content:
