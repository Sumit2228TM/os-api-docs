openapi: 3.0.3
info:
  title: "OpenSpecimen API — Merge Collection Protocols"
  version: 1.0.0
  description: |
    Merge Collection Protocols — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/CollectionProtocolsController.java` (`mergeCollectionProtocol`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/MergeCpDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: CollectionProtocols
    description: "Operations from `CollectionProtocolsController.java`"
paths:
  /collection-protocols/{id}/merge:
    post:
      operationId: mergeCollectionProtocol
      summary: mergeCollectionProtocol
      description: "POST /collection-protocols/merge — `CollectionProtocolsController.java`.`mergeCollectionProtocol`"
      tags:
        - CollectionProtocols
      responses:
        '200':
          description: "Successful response for Merge Collection Protocols"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeCpDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    srcCpShortTitle: sample-srccpshorttitle
                    tgtCpShortTitle: sample-tgtcpshorttitle
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeCpDetail"
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  srcCpShortTitle: sample-srccpshorttitle
                  tgtCpShortTitle: sample-tgtcpshorttitle
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    MergeCpDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/MergeCpDetail.java`"
      properties:
        srcCpShortTitle:
          type: string
        tgtCpShortTitle:
          type: string
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
