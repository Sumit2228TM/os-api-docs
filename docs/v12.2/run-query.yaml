openapi: 3.0.3
info:
  title: "OpenSpecimen API — Run Query"
  description: |
    Run Query — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/QueryController.java` (`executeQuery`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/de/events/ExecuteQueryEventOp.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: Query
    description: "Operations from `QueryController.java`"
paths:
  /query:
    post:
      operationId: executeQuery
      summary: executeQuery
      description: "POST /query — `QueryController.java`.`executeQuery`"
      tags:
        - Query
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteQueryEventOp"
            example:
              aql: "select Participant.ppid where Specimen.availableQty > 0"
              cpId: 1
      responses:
        '201':
          description: "Run Query completed successfully (`POST /query`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryExecResult"
              example:
                aql: "select Participant.ppid where Specimen.availableQty > 0"
                cpId: 1
                id: 1
                rows:
                  - ppid: PT_001
                count: 1
        '400':
          description: "Request failed validation or business rules for `POST /query` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Run Query, invalid identifiers in the path, or domain constraints on query."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestValidation:
                  summary: "Request validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid request for Run Query."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /query` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `POST /query` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for query operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accessDenied:
                  summary: "Access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You are not authorized for Run Query."
        '404':
          description: "No entity exists for the identifiers in `POST /query` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  summary: "Resource not found"
                  value:
                    - code: NOT_FOUND
                      message: "Resource not found for POST /query."
        '500':
          description: "Unexpected failure while processing `POST /query` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  summary: "Internal error"
                  value:
                    - code: internal_error
                      message: "An unexpected error occurred."
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ExecuteQueryEventOp:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/ExecuteQueryEventOp.java`"
      properties:
        querySpace:
          type: string
        cpId:
          type: integer
          format: int64
        cpGroupId:
          type: integer
          format: int64
        drivingForm:
          type: string
        aql:
          type: string
        savedQueryId:
          type: integer
          format: int64
        indexOf:
          type: string
        outputIsoDateTime:
          type: boolean
        outputColumnExprs:
          type: boolean
        synchronous:
          type: boolean
        disableAccessChecks:
          type: boolean
        disableAuditing:
          type: boolean
        reportName:
          type: string
        queryUid:
          type: string
        useReportingDataSource:
          type: boolean
    QueryExecResult:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/QueryExecResult.java`"
      properties:
        columnMetadata:
          type: array
          items:
            $ref: "#/components/schemas/String, Object"
        dbRowsCount:
          type: integer
          format: int32
    String, Object:
      type: object
      description: "Type `String, Object` (Java source not found in repository)"
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
