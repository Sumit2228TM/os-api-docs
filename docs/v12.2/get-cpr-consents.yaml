openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get CPR Consents"
  version: 1.0.0
  description: |
    Get CPR Consents — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/CollectionProtocolRegistrationsController.java` (`getConsents`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/ConsentDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: CollectionProtocolRegistrations
    description: "Operations from `CollectionProtocolRegistrationsController.java`"
paths:
  /collection-protocol-registrations/{cprId}/consents:
    get:
      operationId: getConsents
      summary: getConsents
      description: "GET /collection-protocol-registrations/{id}/consents — `CollectionProtocolRegistrationsController.java`.`getConsents`"
      tags:
        - CollectionProtocolRegistrations
      responses:
        '200':
          description: "Successful response for Get CPR Consents"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    cprId: 101
                    cpId: 101
                    cpShortTitle: sample-cpshorttitle
                    ppid: BBCP-001
                    empi: sample-empi
                    consentSignatureDate: "2024-10-22T14:30:00Z"
                    witness:
                      id: 1001
                    comments: sample-comments
                    consentDocumentName: sample-consentdocumentname
                    statement: sample-statement
                    code: USER_ERROR
                    response: sample-response
                    documentFile:
                      id: 1001
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    ConsentDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/ConsentDetail.java`"
      properties:
        cprId:
          type: integer
          format: int64
        cpId:
          type: integer
          format: int64
        cpShortTitle:
          type: string
        ppid:
          type: string
        empi:
          type: string
        consentSignatureDate:
          type: string
          format: date-time
        witness:
          $ref: "#/components/schemas/UserSummary"
        comments:
          type: string
        consentDocumentName:
          type: string
        statement:
          type: string
        code:
          type: string
        response:
          type: string
        documentFile:
          $ref: "#/components/schemas/File"
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    File:
      type: object
      description: "Type `File` (Java source not found in repository)"
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
