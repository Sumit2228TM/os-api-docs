openapi: 3.0.3
info:
  title: "OpenSpecimen API — Update Collection Protocol Event"
  version: 1.0.0
  description: |
    Update Collection Protocol Event — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/CollectionProtocolEventsController.java` (`updateEvent`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/CollectionProtocolEventDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: CollectionProtocolEvents
    description: "Operations from `CollectionProtocolEventsController.java`"
paths:
  /collection-protocol-events/{id}:
    put:
      operationId: updateEvent
      summary: updateEvent
      description: "PUT /collection-protocol-events/{eventId} — `CollectionProtocolEventsController.java`.`updateEvent`"
      tags:
        - CollectionProtocolEvents
      responses:
        '200':
          description: "Successful response for Update Collection Protocol Event"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionProtocolEventDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    code: USER_ERROR
                    eventLabel: BBCP-2024-001-S1
                    eventPoint: 1
                    eventPointUnit: sample-eventpointunit
                    cpId: 101
                    collectionProtocol: sample-collectionprotocol
                    cpShortTitle: sample-cpshorttitle
                    defaultSite: sample-defaultsite
                    clinicalDiagnosis: sample-clinicaldiagnosis
                    clinicalStatus: Normal
                    visitNamePrintMode: sample-visitnameprintmode
                    visitNamePrintCopies: 1
                    activityStatus: Active
                    specimenRequirements:
                      - id: 1001
                    offset: 1
                    offsetUnit: sample-offsetunit
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionProtocolEventDetail"
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  id: 1001
                  code: USER_ERROR
                  eventLabel: BBCP-2024-001-S1
                  eventPoint: 1
                  eventPointUnit: sample-eventpointunit
                  cpId: 101
                  collectionProtocol: sample-collectionprotocol
                  cpShortTitle: sample-cpshorttitle
                  defaultSite: sample-defaultsite
                  clinicalDiagnosis: sample-clinicaldiagnosis
                  clinicalStatus: Normal
                  visitNamePrintMode: sample-visitnameprintmode
                  visitNamePrintCopies: 1
                  activityStatus: Active
                  specimenRequirements:
                    - id: 1001
                  offset: 1
                  offsetUnit: sample-offsetunit
components:
