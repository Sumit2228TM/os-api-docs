        id:
          type: integer
          format: int64
        code:
          type: string
        eventLabel:
          type: string
        eventPoint:
          type: integer
          format: int32
        eventPointUnit:
          type: string
        cpId:
          type: integer
          format: int64
        collectionProtocol:
          type: string
        cpShortTitle:
          type: string
        defaultSite:
