openapi: 3.0.3
info:
  title: "OpenSpecimen API — Create Visit"
  description: |
    Create Visit — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/VisitsController.java` (`addVisit`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/VisitDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: Visits
    description: "Operations from `VisitsController.java`"
paths:
  /visits:
    post:
      operationId: addVisit
      summary: addVisit
      description: "POST /visits — `VisitsController.java`.`addVisit`"
      tags:
        - Visits
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitDetail"
            example:
              cprId: 1
              name: Visit_001
              status: Complete
              visitDate: 2026-10-26
      responses:
        '201':
          description: "Create Visit completed successfully (`POST /visits`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitDetail"
              example:
                cprId: 1
                name: Visit_001
                status: Complete
                visitDate: 2026-10-26
                id: 10
        '400':
          description: "Request failed validation or business rules for `POST /visits` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Create Visit, invalid identifiers in the path, or domain constraints on visits."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestValidation:
                  summary: "Request validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid request for Create Visit."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /visits` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `POST /visits` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for visits operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accessDenied:
                  summary: "Access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You are not authorized for Create Visit."
        '404':
          description: "No entity exists for the identifiers in `POST /visits` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  summary: "Resource not found"
                  value:
                    - code: NOT_FOUND
                      message: "Resource not found for POST /visits."
        '500':
          description: "Unexpected failure while processing `POST /visits` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  summary: "Internal error"
                  value:
                    - code: internal_error
                      message: "An unexpected error occurred."
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    VisitDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/VisitDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        cpId:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        cprId:
          type: integer
          format: int64
        ppid:
          type: string
        name:
          type: string
        eventCode:
          type: string
        eventLabel:
          type: string
        eventPoint:
          type: integer
          format: int32
        eventPointUnit:
          $ref: "#/components/schemas/IntervalUnit"
        status:
          type: string
        visitDate:
          type: string
          format: date-time
        anticipatedVisitDate:
          type: string
          format: date-time
        totalPendingSpmns:
          type: integer
          format: int32
        pendingPrimarySpmns:
          type: integer
          format: int32
        plannedPrimarySpmnsColl:
          type: integer
          format: int32
        uncollectedPrimarySpmns:
          type: integer
          format: int32
        unplannedPrimarySpmnsColl:
          type: integer
          format: int32
        storedSpecimens:
          type: integer
          format: int32
        notStoredSpecimens:
          type: integer
          format: int32
        distributedSpecimens:
          type: integer
          format: int32
        closedSpecimens:
          type: integer
          format: int32
        missedReason:
          type: string
        missedBy:
          $ref: "#/components/schemas/UserSummary"
        cpTitle:
          type: string
        cpShortTitle:
          type: string
        clinicalDiagnoses:
          type: array
          items:
            type: string
        diagnosisList:
          type: array
          items:
            $ref: "#/components/schemas/PermissibleValueDetails"
        clinicalStatus:
          type: string
        activityStatus:
          type: string
        site:
          type: string
        comments:
          type: string
        surgicalPathologyNumber:
          type: string
        sprName:
          type: string
        sprLocked:
          type: boolean
        code:
          type: string
        cohort:
          type: string
        extensionDetail:
          $ref: "#/components/schemas/ExtensionDetail"
        forceDelete:
          type: boolean
        lookupVisitsByName:
          type: boolean
    IntervalUnit:
      type: string
      enum:
        - DAYS
        - WEEKS
        - MONTHS
        - YEARS
      description: "Java enum `IntervalUnit` from `WEB-INF/src/com/krishagni/catissueplus/core/common/domain/IntervalUnit.java`"
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    PermissibleValueDetails:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/PermissibleValueDetails.java`"
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
        parentValue:
          type: string
        value:
          type: string
        attribute:
          type: string
        conceptCode:
          type: string
    ExtensionDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/ExtensionDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        objectId:
          type: integer
          format: int64
        formId:
          type: integer
          format: int64
        formCaption:
          type: string
        dataEntryStatus:
          type: string
        attrsMap:
          $ref: "#/components/schemas/Map"
        useUdn:
          type: boolean
        name:
          type: string
        udn:
          type: string
        caption:
          type: string
        value:

        type:
          type: string
        displayValue:
          type: string
        codedValue:
          type: string
    Map:
      type: object
      description: "Type `Map` (Java source not found in repository)"
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
