openapi: 3.0.3
info:
  title: "OpenSpecimen API — Validate Password"
  description: |
    Validate Password — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/UserController.java` (`catalogOp`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/PasswordDetails.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: User
    description: "Operations from `UserController.java`"
paths:
  /users/validate-password:
    post:
      operationId: validatePassword
      summary: "Validate Password"
      description: "Catalog endpoint `POST /users/validate-password` documented for OpenSpecimen core API. Java `@RequestMapping` may differ or be absent on this branch; schemas/examples follow the catalog DTO."
      tags:
        - User
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordDetails"
            example:
              password: "TestPassword123!"
      responses:
        '200':
          description: "Validate Password completed successfully (`POST /users/validate-password`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordDetails"
              example:
                password: "TestPassword123!"
                id: 1
                valid: true
        '400':
          description: "Request failed validation or business rules for `POST /users/validate-password` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Validate Password, invalid identifiers in the path, or domain constraints on users. Examples: password policy violation, expired reset token, or incorrect old password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                passwordPolicy:
                  summary: "Password policy violation"
                  value:
                    - code: USER_ERROR
                      message: "Password does not meet policy requirements."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /users/validate-password` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `POST /users/validate-password` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for users operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                passwordForbidden:
                  summary: "Cannot change password"
                  value:
                    - code: FORBIDDEN
                      message: "You are not allowed to change this user's password."
        '404':
          description: "No entity exists for the identifiers in `POST /users/validate-password` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userNotFound:
                  summary: "User not found"
                  value:
                    - code: NOT_FOUND
                      message: "User not found for the given identifier."
        '500':
          description: "Unexpected failure while processing `POST /users/validate-password` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    PasswordDetails:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/PasswordDetails.java`"
      properties:
        userId:
          type: integer
          format: int64
        loginName:
          type: string
        oldPassword:
          type: string
        newPassword:
          type: string
        resetPasswordToken:
          type: string
        ipAddress:
          type: string
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
