openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Specimen Requirement"
  version: 1.0.0
  description: |
    Get Specimen Requirement — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SpecimenRequirementsController.java` (`getRequirement`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/SpecimenRequirementDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: SpecimenRequirements
    description: "Operations from `SpecimenRequirementsController.java`"
paths:
  /specimen-requirements/{id}:
    get:
      operationId: getRequirement
      summary: getRequirement
      description: "GET /specimen-requirements/{id} — `SpecimenRequirementsController.java`.`getRequirement`"
      tags:
        - SpecimenRequirements
      responses:
        '200':
          description: "Successful response for Get Specimen Requirement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecimenRequirementDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    name: "Baseline Visit 1"
                    code: USER_ERROR
                    lineage: sample-lineage
                    specimenClass: Tissue
                    type: "Frozen Tissue"
                    anatomicSite: Breast
                    laterality: Left
                    pathology: sample-pathology
                    storageType: sample-storagetype
                    initialQty: 2.5
                    concentration: 1.0
                    quantityUnit: sample-quantityunit
                    concentrationUnit: sample-concentrationunit
                    collector:
                      id: 1001
                    collectionProcedure: "Surgical Resection"
                    collectionContainer: sample-collectioncontainer
                    receiver:
                      id: 1001
                    labelFmt: BBCP-2024-001-S1
                    labelAutoPrintMode: BBCP-2024-001-S1
                    labelPrintCopies: 1
                    sortOrder: 1
                    defaultCustomFieldValues:
                      id: 1001
                    preBarcodedTube: false
                    eventId: 1101
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
