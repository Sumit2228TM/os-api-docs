openapi: 3.0.3
info:
  title: "OpenSpecimen API — Create Distribution Protocol"
  description: |
    Create Distribution Protocol — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/DistributionProtocolController.java` (`createDistributionProtocol`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/DistributionProtocolDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: DistributionProtocol
    description: "Operations from `DistributionProtocolController.java`"
paths:
  /distribution-protocols:
    post:
      operationId: createDistributionProtocol
      summary: createDistributionProtocol
      description: "POST /distribution-protocols — `DistributionProtocolController.java`.`createDistributionProtocol`"
      tags:
        - DistributionProtocol
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistributionProtocolDetail"
            example:
              irbId: IRB_1029
              principalInvestigator:
                id: 1
              shortTitle: DP_RESEARCH
              title: "Research DP"
      responses:
        '201':
          description: "Create Distribution Protocol completed successfully (`POST /distribution-protocols`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionProtocolDetail"
              example:
                irbId: IRB_1029
                principalInvestigator:
                  id: 1
                shortTitle: DP_RESEARCH
                title: "Research DP"
                id: 1
                activityStatus: Active
        '400':
          description: "Request failed validation or business rules for `POST /distribution-protocols` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Create Distribution Protocol, invalid identifiers in the path, or domain constraints on distribution protocols."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                distributionValidation:
                  summary: "Distribution validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid distribution protocol or order data."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /distribution-protocols` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `POST /distribution-protocols` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for distribution protocols operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                distributionForbidden:
                  summary: "Distribution access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You do not have permission for this distribution protocol."
        '404':
          description: "No entity exists for the identifiers in `POST /distribution-protocols` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                orderNotFound:
                  summary: "Order not found"
                  value:
                    - code: NOT_FOUND
                      message: "Distribution order not found."
        '500':
          description: "Unexpected failure while processing `POST /distribution-protocols` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    DistributionProtocolDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/DistributionProtocolDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        shortTitle:
          type: string
        principalInvestigator:
          $ref: "#/components/schemas/UserSummary"
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        instituteName:
          type: string
        defReceivingSiteName:
          type: string
        distributedSpecimensCount:
          type: integer
          format: int32
        starred:
          type: boolean
        coordinators:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        irbId:
          type: string
        activityStatus:
          type: string
        report:
          $ref: "#/components/schemas/SavedQuerySummary"
        orderExtnForm:
          $ref: "#/components/schemas/FormSummary"
        disableEmailNotifs:
          type: boolean
        attachmentType:
          type: string
        orderItemLabelFormat:
          type: string
        extensionDetail:
          $ref: "#/components/schemas/ExtensionDetail"
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
