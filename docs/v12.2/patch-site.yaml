openapi: 3.0.3
info:
  title: "OpenSpecimen API — Patch Site"
  description: |
    Patch Site — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/SitesController.java` (`patchSite`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/SiteDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: Sites
    description: "Operations from `SitesController.java`"
paths:
  /sites/{id}:
    patch:
      operationId: patchSite
      summary: patchSite
      description: "PATCH /sites/{id} — `SitesController.java`.`patchSite`"
      tags:
        - Sites
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteDetail"
            example:
              name: "Main Site North"
      responses:
        '200':
          description: "Patch Site completed successfully (`PATCH /sites/{id}`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDetail"
              example:
                name: "Main Site North"
                id: 7
        '400':
          description: "Request failed validation or business rules for `PATCH /sites/{id}` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Patch Site, invalid identifiers in the path, or domain constraints on sites."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestValidation:
                  summary: "Request validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid request for Patch Site."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `PATCH /sites/{id}` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `PATCH /sites/{id}` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for sites operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accessDenied:
                  summary: "Access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You are not authorized for Patch Site."
        '404':
          description: "No entity exists for the identifiers in `PATCH /sites/{id}` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  summary: "Resource not found"
                  value:
                    - code: NOT_FOUND
                      message: "Resource not found for PATCH /sites/{id}."
        '500':
          description: "Unexpected failure while processing `PATCH /sites/{id}` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  summary: "Internal error"
                  value:
                    - code: internal_error
                      message: "An unexpected error occurred."
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SiteDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/SiteDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        instituteName:
          type: string
        code:
          type: string
        type:
          type: string
        activityStatus:
          type: string
        cpCount:
          type: integer
          format: int32
        address:
          type: string
        extensionDetail:
          $ref: "#/components/schemas/ExtensionDetail"
    ExtensionDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/ExtensionDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        objectId:
          type: integer
          format: int64
        formId:
          type: integer
          format: int64
        formCaption:
          type: string
        dataEntryStatus:
          type: string
        attrsMap:
          $ref: "#/components/schemas/Map"
        useUdn:
          type: boolean
        name:
          type: string
        udn:
          type: string
        caption:
          type: string
        value:

        type:
          type: string
        displayValue:
          type: string
        codedValue:
          type: string
    Map:
      type: object
      description: "Type `Map` (Java source not found in repository)"
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
