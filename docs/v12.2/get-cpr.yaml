openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get CPR"
  description: |
    Get CPR — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/CollectionProtocolRegistrationsController.java` (`getRegistration`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/CollectionProtocolRegistrationDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: CollectionProtocolRegistrations
    description: "Operations from `CollectionProtocolRegistrationsController.java`"
paths:
  /collection-protocol-registrations/{id}:
    get:
      operationId: getRegistration
      summary: getRegistration
      description: "GET /collection-protocol-registrations/{cprId} — `CollectionProtocolRegistrationsController.java`.`getRegistration`"
      tags:
        - CollectionProtocolRegistrations
      security:
        - ApiToken: []
      parameters:
        - name: cprId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "Get CPR completed successfully (`GET /collection-protocol-registrations/{id}`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionProtocolRegistrationDetail"
              example:
                cpId: 1
                id: 5001
                ppid: PT_001
        '400':
          description: "Request failed validation or business rules for `GET /collection-protocol-registrations/{id}` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Get CPR, invalid identifiers in the path, or domain constraints on collection protocol registrations. Examples: invalid `cpId`, closed CP, or duplicate registration for the participant."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                cprValidation:
                  summary: "CPR validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid CPR or participant registration data."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `GET /collection-protocol-registrations/{id}` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `GET /collection-protocol-registrations/{id}` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for collection protocol registrations operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                cprForbidden:
                  summary: "CPR access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You do not have permission for this collection protocol."
        '404':
          description: "No entity exists for the identifiers in `GET /collection-protocol-registrations/{id}` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                cprNotFound:
                  summary: "CPR not found"
                  value:
                    - code: NOT_FOUND
                      message: "Collection protocol registration not found."
        '500':
          description: "Unexpected failure while processing `GET /collection-protocol-registrations/{id}` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
