openapi: 3.0.3
info:
  title: "OpenSpecimen API — Export Distribution Order"
  description: |
    Export Distribution Order — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/DistributionOrderController.java` (`exportDistributionReport`).
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: DistributionOrder
    description: "Operations from `DistributionOrderController.java`"
paths:
  /distribution-orders/{id}/export:
    get:
      operationId: exportDistributionReport
      summary: exportDistributionReport
      description: "GET /distribution-orders/{id}/report — `DistributionOrderController.java`.`exportDistributionReport`"
      tags:
        - DistributionOrder
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "Export Distribution Order completed successfully (`GET /distribution-orders/{id}/export`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryDataExportResult"
              example:
                contentType: text/csv
                fileName: Order_2026_01.csv
        '400':
          description: "Request failed validation or business rules for `GET /distribution-orders/{id}/export` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Export Distribution Order, invalid identifiers in the path, or domain constraints on distribution orders."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                distributionValidation:
                  summary: "Distribution validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid distribution protocol or order data."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `GET /distribution-orders/{id}/export` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `GET /distribution-orders/{id}/export` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for distribution orders operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                distributionForbidden:
                  summary: "Distribution access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You do not have permission for this distribution protocol."
        '404':
          description: "No entity exists for the identifiers in `GET /distribution-orders/{id}/export` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                orderNotFound:
                  summary: "Order not found"
                  value:
                    - code: NOT_FOUND
                      message: "Distribution order not found."
        '500':
          description: "Unexpected failure while processing `GET /distribution-orders/{id}/export` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    QueryDataExportResult:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/QueryDataExportResult.java`"
      properties:
        dataFile:
          type: string
        completed:
          type: boolean
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
