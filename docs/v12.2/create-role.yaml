openapi: 3.0.3
info:
  title: "OpenSpecimen API — Create Role"
  description: |
    Create Role — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/RbacController.java` (`createRole`).
    DTO: `WEB-INF/src/com/krishagni/rbac/events/RoleDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: Rbac
    description: "Operations from `RbacController.java`"
paths:
  /rbac/roles:
    post:
      operationId: createRole
      summary: createRole
      description: "POST /rbac/roles — `RbacController.java`.`createRole`"
      tags:
        - Rbac
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleDetail"
            example:
              acl:
                - operations:
                    - Read
                    - Create
                    - Update
                  resource: Specimen
              name: "Lab Technician"
      responses:
        '201':
          description: "Create Role completed successfully (`POST /rbac/roles`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
              example:
                acl:
                  - operations:
                      - Read
                      - Create
                      - Update
                    resource: Specimen
                name: "Lab Technician"
                id: 3
        '400':
          description: "Request failed validation or business rules for `POST /rbac/roles` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Create Role, invalid identifiers in the path, or domain constraints on rbac."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userValidation:
                  summary: "User or role validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid user or RBAC payload."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /rbac/roles` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Caller cannot administer roles for `POST /rbac/roles`. Requires administrative privileges to modify RBAC definitions or subject role bindings."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                adminForbidden:
                  summary: "Administrative access denied"
                  value:
                    - code: FORBIDDEN
                      message: "Administrative privilege required."
        '404':
          description: "No entity exists for the identifiers in `POST /rbac/roles` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userRoleNotFound:
                  summary: "User or role not found"
                  value:
                    - code: NOT_FOUND
                      message: "User or role not found."
        '500':
          description: "Unexpected failure while processing `POST /rbac/roles` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RoleDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/rbac/events/RoleDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
