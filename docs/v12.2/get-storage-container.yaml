openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get Storage Container"
  version: 1.0.0
  description: |
    Get Storage Container — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/StorageContainersController.java` (`getStorageContainer`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/StorageContainerDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: StorageContainers
    description: "Operations from `StorageContainersController.java`"
paths:
  /storage-containers/{id}:
    get:
      operationId: getStorageContainer
      summary: getStorageContainer
      description: "GET /storage-containers/{id} — `StorageContainersController.java`.`getStorageContainer`"
      tags:
        - StorageContainers
      responses:
        '200':
          description: "Successful response for Get Storage Container"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageContainerDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    name: "Baseline Visit 1"
                    barcode: BBCP2024001S1
                    displayName: sample-displayname
                    typeId: 1001
                    typeName: sample-typename
                    usedFor: sample-usedfor
                    activityStatus: Active
                    siteName: sample-sitename
                    storageLocation:
                      id: 1001
                    createdBy:
                      id: 1001
                    noOfColumns: 1
                    noOfRows: 1
                    positionLabelingMode: BBCP-2024-001-S1
                    positionAssignment: sample-positionassignment
                    columnLabelingScheme: BBCP-2024-001-S1
                    rowLabelingScheme: BBCP-2024-001-S1
                    freePositions: 1
                    usedPositions: 1
                    capacity: 1
                    storedSpecimens: 1
                    automated: false
                    autoFreezerProvider: sample-autofreezerprovider
                    childContainers:
                      - id: 1001
                    starred: false
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeStats
          in: query
          required: false
          schema:
            type: boolean
            default: false
