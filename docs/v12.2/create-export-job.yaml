openapi: 3.0.3
info:
  title: "OpenSpecimen API — Create Export Job"
  description: |
    Create Export Job — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/ExportJobsController.java` (`createExportJob`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/exporter/events/ExportDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: ExportJobs
    description: "Operations from `ExportJobsController.java`"
paths:
  /export-jobs:
    post:
      operationId: createExportJob
      summary: createExportJob
      description: "POST /export-jobs — `ExportJobsController.java`.`createExportJob`"
      tags:
        - ExportJobs
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDetail"
            example:
              objectType: specimen
              recordIds:
                - 1001
                - 1002
      responses:
        '201':
          description: "Create Export Job completed successfully (`POST /export-jobs`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobDetail"
              example:
                objectType: specimen
                recordIds:
                  - 1001
                  - 1002
                id: 7002
                status: QUEUED
        '400':
          description: "Request failed validation or business rules for `POST /export-jobs` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Create Export Job, invalid identifiers in the path, or domain constraints on export jobs."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestValidation:
                  summary: "Request validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid request for Create Export Job."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `POST /export-jobs` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `POST /export-jobs` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for export jobs operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accessDenied:
                  summary: "Access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You are not authorized for Create Export Job."
        '404':
          description: "No entity exists for the identifiers in `POST /export-jobs` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  summary: "Resource not found"
                  value:
                    - code: NOT_FOUND
                      message: "Resource not found for POST /export-jobs."
        '500':
          description: "Unexpected failure while processing `POST /export-jobs` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  summary: "Internal error"
                  value:
                    - code: internal_error
                      message: "An unexpected error occurred."
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  responses:
    BadRequest:
      description: "Invalid request (`ErrorType.USER_ERROR`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Insufficient permissions (`ErrorType.FORBIDDEN`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Resource not found (`ErrorType.NOT_FOUND`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "Server error (`internal_error`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ExportDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/exporter/events/ExportDetail.java`"
      properties:
        objectType:
          type: string
        params:
          $ref: "#/components/schemas/Map"
        recordIds:
          type: array
          items:
            type: integer
            format: int64
        synchronous:
          type: boolean
        disableNotifs:
          type: boolean
    Map:
      type: object
      description: "Type `Map` (Java source not found in repository)"
    ExportJobDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/exporter/events/ExportJobDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
        totalRecords:
          type: integer
          format: int64
        createdBy:
          $ref: "#/components/schemas/UserSummary"
        creationTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        params:
          $ref: "#/components/schemas/Map"
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    OsDate:
      type: string
      format: date
      description: "Calendar date (`yyyy-MM-dd`) used in OpenSpecimen REST payloads"
      example: 2026-10-26
    OsDateTime:
      type: string
      format: date-time
      description: "ISO-8601 date-time in UTC or server-local offset"
      example: "2026-10-26T10:00:00Z"
    ErrorMessage:
      type: object
      description: "REST error entry (`com.krishagni.catissueplus.rest.ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: SPECIMEN_LABEL_REQUIRED
        message:
          type: string
          example: "Specimen label is required."
    ErrorResponse:
      type: array
      description: "Standard error payload: JSON array of `ErrorMessage` objects"
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessageList:
      $ref: "#/components/schemas/ErrorResponse"
