openapi: 3.0.3
info:
  title: "OpenSpecimen API — Update Distribution Order Status"
  description: |
    Update Distribution Order Status — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/DistributionOrderController.java` (`catalogOp`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/DistributionOrderDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
security:
  - ApiToken: []
tags:
  - name: DistributionOrder
    description: "Operations from `DistributionOrderController.java`"
paths:
  /distribution-orders/{id}/status:
    put:
      operationId: updateDistributionOrderStatus
      summary: "Update Distribution Order Status"
      description: "Catalog endpoint `PUT /distribution-orders/{id}/status` documented for OpenSpecimen core API. Java `@RequestMapping` may differ or be absent on this branch; schemas/examples follow the catalog DTO."
      tags:
        - DistributionOrder
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistributionOrderDetail"
            example:
              executionDate: 2026-10-26
              status: EXECUTED
      responses:
        '200':
          description: "Update Distribution Order Status completed successfully (`PUT /distribution-orders/{id}/status`). Returns the standard OpenSpecimen JSON payload for this operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionOrderDetail"
              example:
                executionDate: 2026-10-26
                status: EXECUTED
                id: 6001
        '400':
          description: "Request failed validation or business rules for `PUT /distribution-orders/{id}/status` (`ErrorType.USER_ERROR`). Typical causes: malformed JSON, missing required fields for Update Distribution Order Status, invalid identifiers in the path, or domain constraints on distribution orders."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                distributionValidation:
                  summary: "Distribution validation failed"
                  value:
                    - code: USER_ERROR
                      message: "Invalid distribution protocol or order data."
        '401':
          description: "Missing, expired, or invalid `X-OS-API-TOKEN` when calling `PUT /distribution-orders/{id}/status` (`ErrorType.UNAUTHORIZED`). Obtain a token from `POST /sessions` and send it on every request except sign-in and sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiToken:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated user lacks RBAC permission or site/CP scope for `PUT /distribution-orders/{id}/status` (`ErrorType.FORBIDDEN` or equivalent access-denied codes surfaced as 400 on some deployments). Verify role assignments for distribution orders operations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                distributionForbidden:
                  summary: "Distribution access denied"
                  value:
                    - code: FORBIDDEN
                      message: "You do not have permission for this distribution protocol."
        '404':
          description: "No entity exists for the identifiers in `PUT /distribution-orders/{id}/status` (`ErrorType.NOT_FOUND`). Confirm path IDs (and query filters for list endpoints) reference persisted records."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                orderNotFound:
                  summary: "Order not found"
                  value:
                    - code: NOT_FOUND
                      message: "Distribution order not found."
        '500':
          description: "Unexpected failure while processing `PUT /distribution-orders/{id}/status` (`ErrorType.SYSTEM_ERROR`, code `internal_error`). Retry later; contact the administrator if the error persists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
