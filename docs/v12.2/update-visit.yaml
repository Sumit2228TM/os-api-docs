openapi: 3.0.3
info:
  title: "OpenSpecimen API — Update Visit"
  version: 1.0.0
  description: |
    Update Visit — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/VisitsController.java` (`updateVisit`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/VisitDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: Visits
    description: "Operations from `VisitsController.java`"
paths:
  /visits/{id}:
    put:
      operationId: updateVisit
      summary: updateVisit
      description: "PUT /visits/{id} — `VisitsController.java`.`updateVisit`"
      tags:
        - Visits
      responses:
        '200':
          description: "Successful response for Update Visit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    id: 1001
                    cpId: 101
                    eventId: 1101
                    cprId: 101
                    ppid: BBCP-001
                    name: "Baseline Visit 1"
                    eventCode: sample-eventcode
                    eventLabel: BBCP-2024-001-S1
                    eventPoint: 1
                    eventPointUnit:
                      id: 1001
                    status: PENDING
                    visitDate: "2024-10-22T14:30:00Z"
                    anticipatedVisitDate: "2024-10-22T14:30:00Z"
                    totalPendingSpmns: 1
                    pendingPrimarySpmns: 1
                    plannedPrimarySpmnsColl: 1
                    uncollectedPrimarySpmns: 1
                    unplannedPrimarySpmnsColl: 1
                    storedSpecimens: 1
                    notStoredSpecimens: 1
                    distributedSpecimens: 1
                    closedSpecimens: 1
                    missedReason: sample-missedreason
                    missedBy:
                      id: 1001
                    cpTitle: sample-cptitle
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitDetail"
            examples:
              biobankExample:
                summary: "Biobanking workflow example"
                value:
                  id: 1001
                  cpId: 101
                  eventId: 1101
                  cprId: 101
                  ppid: BBCP-001
                  name: "Baseline Visit 1"
                  eventCode: sample-eventcode
                  eventLabel: BBCP-2024-001-S1
                  eventPoint: 1
                  eventPointUnit:
                    id: 1001
                  status: PENDING
                  visitDate: "2024-10-22T14:30:00Z"
                  anticipatedVisitDate: "2024-10-22T14:30:00Z"
                  totalPendingSpmns: 1
                  pendingPrimarySpmns: 1
                  plannedPrimarySpmnsColl: 1
                  uncollectedPrimarySpmns: 1
                  unplannedPrimarySpmnsColl: 1
                  storedSpecimens: 1
                  notStoredSpecimens: 1
                  distributedSpecimens: 1
                  closedSpecimens: 1
                  missedReason: sample-missedreason
                  missedBy:
                    id: 1001
                  cpTitle: sample-cptitle
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    VisitDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/biospecimen/events/VisitDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        cpId:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        cprId:
          type: integer
          format: int64
        ppid:
          type: string
        name:
          type: string
        eventCode:
          type: string
        eventLabel:
          type: string
        eventPoint:
          type: integer
          format: int32
        eventPointUnit:
          $ref: "#/components/schemas/IntervalUnit"
        status:
          type: string
        visitDate:
          type: string
          format: date-time
        anticipatedVisitDate:
          type: string
          format: date-time
        totalPendingSpmns:
          type: integer
          format: int32
        pendingPrimarySpmns:
          type: integer
          format: int32
        plannedPrimarySpmnsColl:
          type: integer
          format: int32
        uncollectedPrimarySpmns:
          type: integer
          format: int32
        unplannedPrimarySpmnsColl:
          type: integer
          format: int32
        storedSpecimens:
          type: integer
          format: int32
        notStoredSpecimens:
          type: integer
          format: int32
        distributedSpecimens:
          type: integer
          format: int32
        closedSpecimens:
          type: integer
          format: int32
        missedReason:
          type: string
        missedBy:
          $ref: "#/components/schemas/UserSummary"
        cpTitle:
          type: string
        cpShortTitle:
          type: string
        clinicalDiagnoses:
          type: array
          items:
            type: string
        diagnosisList:
          type: array
          items:
            $ref: "#/components/schemas/PermissibleValueDetails"
        clinicalStatus:
          type: string
        activityStatus:
          type: string
        site:
          type: string
        comments:
          type: string
        surgicalPathologyNumber:
          type: string
        sprName:
          type: string
        sprLocked:
          type: boolean
        code:
          type: string
        cohort:
          type: string
        extensionDetail:
          $ref: "#/components/schemas/ExtensionDetail"
        forceDelete:
          type: boolean
        lookupVisitsByName:
          type: boolean
    IntervalUnit:
      type: string
      enum:
        - DAYS
        - WEEKS
        - MONTHS
        - YEARS
      description: "Java enum `IntervalUnit` from `WEB-INF/src/com/krishagni/catissueplus/core/common/domain/IntervalUnit.java`"
    UserSummary:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/common/events/UserSummary.java`"
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        loginName:
          type: string
        domain:
          type: string
        emailAddress:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        admin:
          type: boolean
        instituteAdmin:
          type: boolean
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        downloadLabelsPrintFile:
          type: boolean
        cpCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        impersonated:
          type: boolean
        daysBeforePasswordExpiry:
          type: integer
          format: int32
    PermissibleValueDetails:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/PermissibleValueDetails.java`"
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
        parentValue:
          type: string
        value:
          type: string
        attribute:
          type: string
        conceptCode:
          type: string
    ExtensionDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/de/events/ExtensionDetail.java`"
      properties:
        id:
          type: integer
          format: int64
        objectId:
          type: integer
          format: int64
        formId:
          type: integer
          format: int64
        formCaption:
          type: string
        dataEntryStatus:
          type: string
        attrsMap:
          $ref: "#/components/schemas/Map"
        useUdn:
          type: boolean
        name:
          type: string
        udn:
          type: string
        caption:
          type: string
        value:

        type:
          type: string
        displayValue:
          type: string
        codedValue:
          type: string
    Map:
      type: object
      description: "Type `Map` (Java source not found in repository)"
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
