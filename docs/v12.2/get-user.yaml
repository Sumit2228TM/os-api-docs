openapi: 3.0.3
info:
  title: "OpenSpecimen API — Get User"
  version: 1.0.0
  description: |
    Get User — generated from repository inspection.
    Controller: `WEB-INF/src/com/krishagni/catissueplus/rest/controller/UserController.java` (`getUser`).
    DTO: `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/UserDetail.java`.
servers:
  - url: /rest/ng
    description: "OpenSpecimen REST servlet context"
tags:
  - name: User
    description: "Operations from `UserController.java`"
paths:
  /users/{id}:
    get:
      operationId: getUser
      summary: getUser
      description: "GET /users/{id} — `UserController.java`.`getUser`"
      tags:
        - User
      responses:
        '200':
          description: "Successful response for Get User"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
              examples:
                biobankExample:
                  summary: "Biobanking workflow example"
                  value:
                    regularType:
                      id: 1001
                    id: 1001
                    firstName: Alex
                    lastName: Rivera
                    emailAddress: "biobank.tech@example.org"
                    domainName: sample-domainname
                    loginName: biobank.tech
                    instituteId: 1001
                    instituteName: sample-institutename
                    primarySite: sample-primarysite
                    type: "Frozen Tissue"
                    phoneNumber: sample-phonenumber
                    manageForms: false
                    manageWfs: false
                    managePrintJobs: false
                    dnd: false
                    apiUser: false
                    ipRange: sample-iprange
                    defaultPrinter: sample-defaultprinter
                    downloadLabelsPrintFile: false
                    address: sample-address
                    timeZone: sample-timezone
                    creationDate: "2024-10-22T14:30:00Z"
                    activityStatus: Active
                    userId: 42
        '400':
          description: "Invalid request or business rule violation (`ErrorType.USER_ERROR`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                validationError:
                  summary: "Business rule violation"
                  value:
                    - code: SPECIMEN_LABEL_REQUIRED
                      message: "Specimen label is required."
        '401':
          description: "Missing or invalid API token (`ErrorType.UNAUTHORIZED`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                unauthorized:
                  summary: "Missing API token"
                  value:
                    - code: UNAUTHORIZED
                      message: "Invalid or missing X-OS-API-TOKEN header."
        '403':
          description: "Authenticated but not authorized for this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                forbidden:
                  summary: "Insufficient privileges"
                  value:
                    - code: RBAC_ACCESS_DENIED
                      message: "You are not authorized to perform this operation."
        '404':
          description: "Resource not found (`ErrorType.NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
              examples:
                notFound:
                  summary: "Entity not found"
                  value:
                    - code: NOT_FOUND
                      message: "Requested resource was not found."
        '500':
          description: "Unexpected server error (`internal_error`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageList"
      security:
        - OsApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
components:
  securitySchemes:
    OsApiToken:
      type: apiKey
      in: header
      name: X-OS-API-TOKEN
      description: "Token from `POST /sessions`"
  schemas:
    UserDetail:
      type: object
      description: "From `WEB-INF/src/com/krishagni/catissueplus/core/administrative/events/UserDetail.java`"
      properties:
        regularType:
          $ref: "#/components/schemas/static String"
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        emailAddress:
          type: string
        domainName:
          type: string
        loginName:
          type: string
        instituteId:
          type: integer
          format: int64
        instituteName:
          type: string
        primarySite:
          type: string
        type:
          type: string
        phoneNumber:
          type: string
        manageForms:
          type: boolean
        manageWfs:
          type: boolean
        managePrintJobs:
          type: boolean
        dnd:
          type: boolean
        apiUser:
          type: boolean
        ipRange:
          type: string
        defaultPrinter:
          type: string
        downloadLabelsPrintFile:
          type: boolean
        address:
          type: string
        timeZone:
          type: string
        creationDate:
          type: string
          format: date-time
        activityStatus:
          type: string
        userId:
          type: string
    static String:
      type: object
      description: "Type `static String` (Java source not found in repository)"
    ErrorMessage:
      type: object
      description: "REST error entry (`ErrorMessage`)"
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorMessageList:
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
